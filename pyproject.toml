[project]
name = "agent-domain-os"
version = "0.1.0"
description = "面向智能体的领域操作系统及其水利领域参考实现"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1",
    "numpy>=2.0",
    "oag",
    "paho-mqtt>=2.1",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
oag = { path = "agent", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain_os*", "domains*", "server*"]
namespaces = true

[tool.setuptools.package-data]
"domains.flood" = ["data/objects/*.jsonl"]
server = ["static/**/*"]
