name: flood
description: "水库下游洪水、道路桥梁、重要设施与避洪转移联动分析领域。面向珊瑚河数据，回答洪水事件中哪些道路、桥梁、设施、转移路线和安置对象受影响，以及应采取哪些封控、撤离、绕行和简报建议。"
tool_preferences:
  generic_search: fallback_only

interaction_policies:
  user_chat:
    description: "珊瑚河 GIS 用户对话策略"
    include_in_system_prompt: true
    instructions:
      - "你服务于以珊瑚河流域 GIS 为中心的前端；当前系统只展示实时预测结果，不提供设计洪水方案切换。"
      - "用户明确要求显示、打开、绘制、加载、叠加、缩放、聚焦或清空地图对象时，必须调用对应 ui_* 工具执行前端动作，不要只用文字说明。"
      - "用户只要求清除、隐藏淹没范围、预测淹没结果或水动力结果时，调用 ui_clear_map 并传 target=inundation；这只移除淹没结果，不改变地图视野。"
      - "基于预测淹没范围判断设施、道路、桥梁、转移路线或安置点是否受影响时，必须调用 analyze_inundation_impacts，不得自行猜测对象级受淹结论。"
      - "用户根据多时刻淹水预测询问最晚转移时间、转移截止时间或安全转移窗口时，必须调用 analyze_latest_evacuation_time；不得把 EvacuationUnit.flood_arrival_window 当作预测分析结论，也不要自行逐格查询 InundationForecastCell 推算。"
      - "已有水动力时间轴时直接分析已有预测；只有用户明确要求运行、重算或更新预测时才调用 run_flood_forecast。"
      - "前端上下文 hydrodynamic_timeline.mode=time_slice 且用户询问当前时刻、当前画面或该时刻影响时，把 current_hydrodynamic_time_h 作为 analyze_inundation_impacts.time_h；用户询问总体或最大影响时不传 time_h。"
      - "预测结果中的 time_h、arrival_time_h 以及名称以 _time_h 结尾的预测时间均是相对 valid_from 的小时偏移，不是钟表时间。面向用户说明何时发生时，优先使用工具返回的 analysis_time_at、valid_at、first_unsafe_at、latest_departure_at 等实际时刻，并可把预测 +Nh 作为辅助信息；不得把 generated_at 当作预测基准时刻。"
      - "用户要求运行预测、实时预测或未来淹没时，先调用 run_flood_forecast，再用 HydrodynamicGridCell 和 forecast_id=latest 展示预测淹没结果。"
      - "用户要求自主观测、持续预测、自动告警、闭环调度或避洪转移调度时，调用 run_emergency_cycle，再按结果展示相关领域对象。"
      - "不要把 severity_index 或综合指标映射为 5/10/20/50/100 年一遇设计方案；防洪响应预案必须通过已实现工具或人工审批。"
      - "用户要求规划导航、避洪路线或绕开淹没区域前往安置点时调用 plan_evacuation_route；同一起终点每个用户请求最多调用一次，no_safe_route 或 retryable=false 后不得自行改变交通方式、预测时刻或避洪参数重试。"
      - "路线规划成功后使用结果中的 evacuation_route_id 展示本次生成的 EvacuationRoute；一次展示多个对象时放入同一次 ui_show_objects 调用。"
      - "用户要求把当前或刚才的建议作为应急指令初稿、新建应急指令或准备发出指令时，调用 ui_open_emergency_directive_editor；根据对话上下文生成简洁标题、明确接收对象、优先级和可编辑正文。该工具只打开草稿编辑器，必须由用户在前端修改并确认后才会发出。"
    intents:
      count:
        keywords: ["几个", "多少个", "数量", "总数"]
        tools: [count]
        task_hint: "本问题是领域对象库的直接数量查询。请直接调用 {calls}；不要先查询无关对象或对象几何，也不要添加用户未明确给出的过滤条件。得到 count 结果后立即回答。"
      map:
        keywords: ["地图", "显示", "打开", "画", "绘制", "加载", "叠加", "聚焦", "定位", "缩放", "清空", "隐藏", "不显示"]
        tools: [ui_show_objects, ui_show_event_marker, ui_clear_map, ui_focus_object]
      impact:
        keywords: ["受影响", "受淹", "淹水影响", "淹没影响", "涉水", "能否通行"]
        context_keywords: ["受影响", "受淹", "淹水影响", "淹没影响", "涉水"]
        tools: [analyze_inundation_impacts, ui_show_objects, ui_show_event_marker, ui_clear_map, ui_focus_object]
      latest_evacuation_time:
        keywords: ["最晚转移时间", "最迟转移时间", "转移截止时间", "最晚撤离时间", "最迟撤离时间", "安全转移窗口", "转移时间窗口"]
        context_keywords: ["24小时淹水", "多时刻淹水", "淹水预测", "洪水到达时间", "转移时间"]
        tools: [analyze_latest_evacuation_time]
      route:
        keywords: ["路线", "路径", "导航", "绕行", "怎么走", "安置点", "重新规划", "规划一条", "→", "->"]
        context_keywords: ["路线", "路径", "导航", "绕行", "安置点", "重新规划"]
        tools: [plan_evacuation_route, ui_show_objects, ui_show_event_marker, ui_clear_map, ui_focus_object]
      forecast:
        keywords: ["运行预测", "重新预测", "重算", "重新计算", "更新预测", "启动预测", "未来淹没"]
        tools: [run_flood_forecast, ui_show_objects, ui_show_event_marker, ui_clear_map, ui_focus_object]
      emergency_cycle:
        keywords: ["闭环", "应急循环", "自主观测", "持续预测", "自动告警", "自动调度"]
        tools: [run_emergency_cycle, ui_show_objects, ui_show_event_marker, ui_clear_map, ui_focus_object]
      directive:
        keywords: ["生成应急指令", "形成应急指令", "指令初稿", "新建指令", "发出指令", "作为初稿"]
        context_keywords: ["建议", "应急指令", "指令初稿"]
        tools: [ui_open_emergency_directive_editor]

presentation_tools:
  ui_show_objects:
    summary: "在 GIS 地图中显示领域对象"
    description: "在前端 GIS 地图中显示一个或多个领域对象。对象类型必须来自 ontology，不使用前端图层名。"
    usage_prompt: >-
      用户明确要求显示、打开、绘制、加载、叠加或查看地图对象时调用。
      对象名称映射来自 ontology：{object_aliases}。
      根据影响分析结果展示受影响对象时，从 impacts 中按 object_type 汇总 object_id，
      设置 object_ids、highlight=true 和 show_only_object_ids=true。
      展示多个类型时，将全部对象放入同一次调用的 objects 数组。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_clear_map:
    summary: "清理或重置 GIS 地图显示"
    description: "清空或重置前端 GIS 地图显示，不修改领域数据。"
    usage_prompt: >-
      用户只要求清除、不显示或隐藏淹没范围、预测结果时，target 必须使用 inundation；
      target=map 用于重置整个地图。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

  ui_set_inundation_alert:
    summary: "设置珊瑚河流域预测淹没警戒"
    description: "根据24小时洪水预测是否存在淹没，开启或清除珊瑚河流域边界的红色警戒样式。"
    usage_prompt: >-
      只用于表达当前24小时预测是否存在淹没，不表示整个流域都会被淹，
      也不用于判断具体道路、设施或转移对象是否受影响。
      active=true 显示红色流域警戒边界，active=false 清除警戒并恢复默认边界。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

  ui_focus_object:
    summary: "定位并高亮 GIS 对象"
    description: "缩放、打开弹窗并高亮前端地图中的一个领域对象，不修改领域数据。"
    usage_prompt: "用户要求定位、聚焦或缩放到某个对象时调用。"
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_show_event_marker:
    summary: "在 GIS 地图中显示事件标记"
    description: "在前端 GIS 地图中显示一个具有明确单点位置的领域事件 marker，不修改领域数据。"
    usage_prompt: >-
      只有事件对象包含明确 longitude/latitude 时才调用；没有明确单点位置的事件不创建 marker。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_open_emergency_directive_editor:
    summary: "打开应急指令草稿编辑器"
    description: "根据智能体当前建议生成应急指令初稿，并在态势工作台打开编辑器供用户修改、确认和发出；本工具本身不发出指令。"
    usage_prompt: >-
      用户明确要求把当前或刚才的建议作为初稿、新建应急指令或准备发出指令时调用。
      title、content 和 recipients 必须根据本轮对话及已核实事实生成；priority 默认 urgent。
      正文应直接可执行，避免加入未经工具核实的距离、通行状态或资源承诺。
      调用后不要声称指令已经发出，必须说明草稿已在编辑器中打开，等待用户修改和确认。
    side_effect_scope: frontend_editor
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

event_policies:
  FloodForecastRequired:
    display_name: "洪水预测请求事件"
    role: "珊瑚河洪水应急智能体"
    description: "领域策略已根据当前时刻至 +24h 的边界流量预测窗口生成洪水预测请求。"
    allowed_tools: [inspect, query, count, run_flood_forecast]
    forbidden_functions: [run_emergency_cycle]
    instructions:
      - "领域策略已经完成阈值判断；当事件 forecast_trigger.should_run_forecast=true 时，必须由你调用一次 run_flood_forecast，forecast_id 使用 latest。不要只用文字说明将要预测。"
      - "事件 payload 包含当前预测时刻 observation、与触发判断完全相同的 25 点 forecast_input，以及 forecast_trigger；run_flood_forecast 会读取事件对应的稳定输入快照，CNN 计算与结果保存由该工具完成。"
      - "本洪水预测请求事件只负责判断并运行洪水预测，不在当前事件阶段执行对象级影响分析或防洪响应预案；预测完成后系统会另行发布预测淹没结果生成事件，由后续事件判断是否存在淹没、设置流域警戒并展示预测淹没范围。对象级影响分析在后续事件中也不会自动执行，只有用户明确提出后才执行。结论中必须写清‘当前洪水预测请求事件未执行对象级影响分析；后续预测淹没结果生成事件也不自动执行，需用户明确提出后分析’，不得声称后续事件将自动执行影响分析。"
    conclusion_fields: ["24小时预测窗口", "触发原因", "是否调用了预测模型"]

  InundationGenerated:
    display_name: "预测淹没结果生成事件"
    role: "珊瑚河洪水应急智能体"
    description: "水动力模型已经生成24小时预测结果，本事件负责判断预测期内是否存在淹没并表达流域警戒态势。"
    allowed_tools: [ui_set_inundation_alert, ui_show_objects]
    forbidden_functions: [run_emergency_cycle]
    instructions:
      - "只根据事件 payload 中 CNN 预测汇总判断未来24小时是否存在淹没：forecast_cell_count>0 表示存在至少一个水深不低于0.04米的预测淹没单元，否则表示无淹没。"
      - "必须调用一次 ui_set_inundation_alert：存在淹没时传 active=true，无淹没时传 active=false，以确保旧警戒状态也能被清除。"
      - "本事件不执行对象级影响分析，不判断具体道路、设施、桥梁、转移路线、转移对象或安置点是否受影响；这些分析只在用户明确提出后执行。"
      - "防洪响应预案在本事件中保持切断。"
    automatic_map:
      mode: when_relevant
      tool: ui_show_objects
      objects:
        - object_type: HydrodynamicGridCell
          filters: {forecast_id: latest}
          label: "预测淹没结果"
          fit: false
          refresh: true
      allowed_action_types: [show_hydrodynamic_mesh, apply_hydrodynamic_result, set_watershed_inundation_alert]
      other_objects: on_user_request
      include_result_cards: false
    conclusion_fields: ["预测运行", "24小时内是否存在淹没", "淹没面积", "最大水深", "流域警戒边界状态", "是否已请求淹没范围地图展示"]

objects:
  River:
    kind: entity
    display_name: "珊瑚河"
    aliases:
      - {terms: ["珊瑚河", "主河道", "河道中心线"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: river_id
    summary: "河流主体"
    description: "River 表达珊瑚河这个河流主体，是水文、洪水过程、水利工程和流域对象的关联中心。流域范围由 Watershed 表达。"
    properties:
      river_id: {type: str, required: true, description: "河流编号，如 shanhu"}
      name: {type: str, description: "河流名称"}
      water_system: {type: str, description: "所属水系"}
      watershed_id: {type: str, description: "默认关联的流域编号"}
      watershed_name: {type: str, description: "默认关联的流域名称"}

  Watershed:
    kind: entity
    display_name: "珊瑚河流域"
    aliases:
      - {terms: ["流域", "小流域", "流域范围"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: watershed_id
    summary: "河流流域范围"
    description: "Watershed 表达珊瑚河流域范围及相关小流域，是河流、行政区、水系和风险对象的空间语义范围。"
    properties:
      watershed_id: {type: str, required: true, description: "流域编号，如 shanhu_watershed"}
      river_id: {type: str, description: "所属河流编号"}
      name: {type: str, description: "流域名称"}
      watershed_type: {type: str, description: "流域类型，如 flood_risk_basin/small_watershed"}
      area_km2: {type: float, description: "流域面积，若数据可得"}

  HydrodynamicBoundary:
    kind: entity
    display_name: "水动力边界"
    aliases:
      - {terms: ["水动力边界", "模型边界", "断面"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: boundary_id
    summary: "水动力模型边界和断面位置"
    description: "表达水动力模型中上游入流、沿程入流、支流入流、下游水位边界以及断面位置，用于解释模型输入边界与计算断面的业务角色。"
    properties:
      boundary_id: {type: str, required: true, description: "水动力边界对象编号"}
      river_id: {type: str, description: "所属河流编号"}
      name: {type: str, description: "边界或断面名称"}
      source_name: {type: str, description: "原始数据中的边界或断面名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      boundary_group: {type: str, description: "边界分组: upstream/interval1/interval2/tonggu/waterlevel"}
      boundary_type: {type: str, description: "原始边界类型或水动力输入类型"}
      boundary_role: {type: str, description: "业务角色: upstream_inflow/lateral_inflow/tributary_inflow/downstream_water_level"}
      is_model_input_boundary: {type: bool, description: "是否为 CNN 水动力模型的 4 个流量输入边界之一"}
      section_code: {type: str, description: "断面编号，若来源为断面位置"}
      flow_node: {type: str, description: "水动力模型 FlowNode 编号，若源数据提供"}

  County:
    kind: entity
    countable: true
    display_name: "县级行政区"
    aliases:
      - {terms: ["县级边界", "行政边界", "县"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: county_id
    summary: "县级行政区"
    description: "County 表达县级行政区，领域分析时以县为行政责任和统计单元。"
    properties:
      county_id: {type: str, required: true, description: "县级行政区编码"}
      river_id: {type: str, description: "关联河流编号，当前用于表达珊瑚河流域涉及的县"}
      name: {type: str, description: "县名"}
      adcode: {type: str, description: "行政区划代码"}

  Town:
    kind: entity
    countable: true
    display_name: "乡镇"
    aliases:
      - {terms: ["乡镇", "乡镇边界", "镇界"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: town_id
    summary: "乡镇及灾前暴露信息"
    description: "由灾前信息表、转移单元和安置点中的 OwnerTown 字段共同支撑。人口、GDP、产业和房屋财产暴露信息作为 Town 属性。"
    properties:
      town_id: {type: str, required: true, description: "乡镇编码或稳定ID"}
      name: {type: str, description: "乡镇名称"}
      county_id: {type: str, description: "所属县编码"}
      adcode: {type: str, description: "乡镇行政区划代码"}
      population: {type: int, description: "常住人口"}
      gdp_10k_cny: {type: float, description: "GDP，万元"}
      agriculture_10k_cny: {type: float, description: "农林牧渔业产值，万元"}
      housing_property_10k_cny: {type: float, description: "居民房屋及室内财产，万元"}
      transport_industry_10k_cny: {type: float, description: "交通运输业产值，万元"}
      commerce_10k_cny: {type: float, description: "商贸服务业产值，万元"}

  Reservoir:
    kind: entity
    countable: true
    display_name: "水库"
    aliases:
      - {terms: ["水库"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: reservoir_id
    summary: "水库工程"
    description: "水库对象承接下游洪水来源、调度过程和工程台账信息。"
    properties:
      reservoir_id: {type: str, required: true, description: "水库编号"}
      name: {type: str, description: "水库名称"}
      river_id: {type: str, description: "所在河流编号"}
      county_id: {type: str, description: "所在县编码"}
      town_name: {type: str, description: "所在乡镇"}
      capacity_10k_m3: {type: float, description: "总库容，万立方米"}
      dam_top_elevation_m: {type: float, description: "坝顶高程"}
      design_flood_standard_year: {type: float, description: "设计洪水标准，年一遇"}
      check_flood_standard_year: {type: float, description: "校核洪水标准，年一遇"}
      max_discharge_m3s: {type: float, description: "最大泄量"}
      safety_status: {type: str, description: "安全状态或安全类别"}
      normal_pool_level_m: {type: float, default: 245.30, description: "正常蓄水位，米；低于该值显示绿色，达到后显示黄色"}
      design_flood_level_m: {type: float, default: 247.92, description: "设计洪水位，米；达到后显示橙色"}
