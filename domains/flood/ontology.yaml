      - {terms: ["路线", "路径", "转移路线", "绕行路线"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: evacuation_route_id
    summary: "连接转移单元与安置地点的路线"
    description: "EvacuationRoute 表达从 EvacuationUnit 到 EvacuationSite 的预定或动态规划路线，通过 route_type 区分转移、救援、绕行和保障路线。"
    properties:
      evacuation_route_id: {type: str, required: true, description: "转移路线稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始数据中的路线名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      route_type: {type: str, description: "路线类型: navigation/transfer/rescue/detour/supply"}
      road_detail: {type: str, description: "路线道路描述"}
      origin_unit_id: {type: str, description: "起点转移单元ID；非转移单元起点的动态路线可为空"}
      destination_site_id: {type: str, description: "终点安置地点ID"}
      population: {type: int, description: "服务或转移人口"}
      length_m: {type: float, description: "路线长度，米"}
      duration_s: {type: float, description: "预计通行时间，秒"}
      status: {type: str, description: "路线状态，如 planned/approved/blocked"}
      routing_engine: {type: str, description: "路线计算引擎"}
      candidate_count: {type: int, description: "高德返回的候选路线数量"}
      selected_candidate_index: {type: int, description: "最终采用的高德候选路线序号，从1开始"}
      rejected_candidate_count: {type: int, description: "因涉水或校验失败被排除的候选路线数量"}
      profile: {type: str, description: "路由交通模式，如 car/foot"}
      flood_validation: {type: str, description: "initial_dry 演示初始无洪水 / checked 已按有效预测校核"}
      forecast_id: {type: str, description: "规划依据的洪水预测ID"}
      time_h: {type: float, description: "规划依据的预测时刻，小时"}
      blocked_depth_m: {type: float, description: "道路禁行水深阈值，米"}
      start_endpoint_distance_m: {type: float, description: "高德路线起点到领域对象起点的距离，米"}
      destination_endpoint_distance_m: {type: float, description: "高德路线终点到目标地点的距离，米"}
      max_endpoint_distance_m: {type: float, description: "路线端点允许偏离领域对象坐标的最大距离，米"}
      detour_ratio: {type: float, description: "路线长度与起终点直线距离之比"}
      start_object_type: {type: str, description: "起点对象类型"}
      start_object_id: {type: str, description: "起点对象ID"}
      instructions: {type: json, description: "路线逐步导航信息 JSON 数组，每步包含 text、street_name、distance、time"}

  FloodForecast:
    kind: entity
    display_name: "洪水预测"
    aliases:
      - {terms: ["预测运行", "洪水预测"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: forecast_id
    summary: "一次洪水预测及其结果摘要"
    description: "FloodForecast 表示一次水文-水动力联动预测运行，记录水文边界、模型名称、生成时间和预测淹没统计；模型原始输出保存在所属演进工作空间。"
    properties:
      forecast_id: {type: str, required: true, description: "预测运行ID，如 v001；latest 仅作为查询当前最新预测的别名"}
      forecast_version: {type: str, description: "当前演进内的预测版本，如 v001"}
      forecast_sequence: {type: int, description: "当前演进内的预测顺序号"}
      workspace_id: {type: str, description: "保存本次预测的当前演进工作空间ID"}
      name: {type: str, description: "预测运行名称"}
      status: {type: str, description: "运行状态"}
      model_name: {type: str, description: "模型名称"}
      model_description: {type: str, description: "模型说明"}
      generated_at: {type: str, description: "生成时间"}
      forecast_time: {type: str, description: "本次预测的起报或触发时间"}
      valid_from: {type: str, description: "预测结果有效时段起点"}
      valid_to: {type: str, description: "预测结果有效时段终点"}
      trigger_reason: {type: str, description: "触发本次预测的领域策略原因"}
      is_latest: {type: bool, description: "是否为当前演进的最新预测"}
      lead_time_h: {type: float, description: "预见期，小时"}
      mesh_source_id: {type: str, description: "作为计算网格来源的水动力网格集合"}
      hydrology_inputs: {type: str, description: "水文边界条件 JSON"}
      forcing_index: {type: float, description: "综合水文边界强度，仅作为模型内部无量纲输入"}
      forecast_cell_count: {type: int, description: "预测有水深的单元数量"}
      inundated_area_km2: {type: float, description: "预测淹没面积，平方千米"}
      max_depth_m: {type: float, description: "最大预测水深，米"}
      mean_depth_m: {type: float, description: "平均预测水深，米"}

  EmergencyDirective:
    kind: entity
    countable: true
    display_name: "应急指令"
    aliases:
      - {terms: ["应急指令", "已发指令", "指令记录"]}
    data_source: external_api
    mutability: append_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: directive_id
    summary: "当前演进中经用户确认发出的应急指令"
    description: "EmergencyDirective 只表示已经由用户在态势工作台确认发出的指令；智能体生成但尚未确认的前端初稿不作为领域对象保存。"
    properties:
      directive_id: {type: str, required: true, description: "指令编号"}
      workspace_id: {type: str, description: "所属当前演进工作空间ID"}
      title: {type: str, description: "指令标题"}
      content: {type: str, description: "指令正文"}
      recipients: {type: str, description: "接收对象"}
      priority: {type: str, description: "优先级: normal/urgent/critical"}
      status: {type: str, description: "指令状态，当前为 issued"}
      simulation_time: {type: str, description: "发出时的演进模拟时间"}
      forecast_version: {type: str, description: "发出指令时所依据的预测版本"}
      issued_at: {type: str, description: "用户确认发出时间"}

  InundationForecastCell:
    kind: entity
    display_name: "淹没预测单元"
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: forecast_cell_id
    summary: "指定洪水预测下的淹没网格结果"
    description: "InundationForecastCell 由静态水动力网格和所属工作空间内指定时刻的模型水深结果按需派生，承载预测水深、流速、到达时间和退水时间，不单独持久化网格几何副本。"
    properties:
      forecast_cell_id: {type: str, required: true, description: "预测计算单元ID"}
      forecast_id: {type: str, description: "所属预测运行ID"}
      model_name: {type: str, description: "输出该单元的模型名称"}
      mesh_cell_id: {type: str, description: "基础计算网格单元ID"}
      mesh_source_id: {type: str, description: "基础网格来源"}
      lead_time_h: {type: float, description: "预见期，小时"}
      centroid_lon: {type: float, description: "单元中心经度"}
      centroid_lat: {type: float, description: "单元中心纬度"}
      distance_to_river_m: {type: float, description: "到河道中心线距离，米"}
      ground_elevation_m: {type: float, description: "地面高程，米"}
      water_level_m: {type: float, description: "预测水位，米"}
      depth_m: {type: float, description: "预测水深，米"}
      velocity_mps: {type: float, description: "预测流速，米每秒"}
      arrival_time_h: {type: float, description: "洪水到达时间，小时"}
      recession_time_h: {type: float, description: "退水时间，小时"}
      risk_level: {type: str, description: "由水深和流速派生的风险等级"}
      area_m2: {type: float, description: "单元面积，平方米"}

  HydrodynamicGridCell:
    kind: entity
    display_name: "水动力网格单元"
    aliases:
      - {terms: ["水动力网格", "模型网格", "GT.txt 网格", "预测淹没结果"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: hydrodynamic_cell_id
    summary: "水动力模型网格单元"
    description: "HydrodynamicGridCell 是水动力模型的静态三角网格计算单元，可承载某次预测对应的最大水深结果。"
    properties:
      hydrodynamic_cell_id: {type: str, required: true, description: "水动力网格单元ID"}
      cell_id: {type: int, description: "模型原始 cell 编号"}
      depth_m: {type: float, description: "模型输出最大水深，米；0 表示无水"}
      is_flooded: {type: bool, description: "是否有水深"}

  Station:
    kind: entity
    display_name: "测站"
    aliases:
      - {terms: ["测站", "监测站", "雨量站", "水位站"]}
      - {terms: ["山洪测站", "山洪站"], filters: {station_type: flash_flood}}
      - {terms: ["气象测站", "气象站"], filters: {station_type: meteorological}}
      - {terms: ["水文测站", "水文站"], filters: {station_type: hydrological}}
      - {terms: ["水库测站", "水库站"], filters: {station_type: reservoir}}
    countable: true
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: station_id
    summary: "山洪、气象、水文或水库测站"
    description: "表达珊瑚河流域测站。station_type 支持 flash_flood、meteorological、hydrological、reservoir；当前对象库包含有坐标的山洪、气象、水文测站以及龙潭水库站。"
    properties:
      station_id: {type: str, required: true, description: "测站ID，当前直接采用源测站编码"}
      station_code: {type: str, required: true, description: "源测站编码"}
      river_id: {type: str, description: "关联河流编号"}
      reservoir_id: {type: str, description: "水库测站关联的水库编号"}
      name: {type: str, description: "测站名称"}
      station_type: {type: str, description: "测站类型: flash_flood/meteorological/hydrological/reservoir"}
      station_type_name: {type: str, description: "测站类型中文名称"}
      source_system: {type: str, description: "源表中的数据来源系统: 山洪/气象/水文/水库"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}
      observation_items: {type: str, description: "已知观测项目；当前清单来自雨量站工作表"}
      coordinate_quality: {type: str, description: "坐标质量说明；源文件未声明坐标系，当前按 WGS84 用于 GeoJSON 展示，后续需校核"}

  DangerArea:
    kind: entity
    display_name: "危险区"
    aliases:
      - {terms: ["危险区", "风险点", "风险区"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: danger_area_id
    summary: "静态危险区台账对象"
    description: "表达本地危险区台账中的静态空间点。预测淹没影响由 analyze_inundation_impacts 动态计算，不写入 DangerArea 对象库。"
    properties:
      danger_area_id: {type: str, required: true, description: "危险区稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始台账中的自然村名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      danger_area_type: {type: str, description: "危险区类型，当前为 flood_danger_area"}
      risk_level: {type: str, description: "风险等级: low/medium/high/critical/unknown"}
      city: {type: str, description: "所在市"}
      county_name: {type: str, description: "所在县区"}
      town_name: {type: str, description: "所在乡镇"}
      village_committee: {type: str, description: "行政村"}
      natural_village: {type: str, description: "自然村或自然屯"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}
      evidence: {type: str, description: "风险判断依据"}
      data_quality: {type: str, description: "证据质量，当前为 table_record"}
      recommended_action: {type: str, description: "建议动作摘要"}

