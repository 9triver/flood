      check_flood_level_m: {type: float, default: 248.91, description: "校核洪水位，米；超过后显示红色严重警告"}
      design_flood_warning_level_m: {type: float, default: 247.62, description: "接近设计洪水位的提示阈值，米；按设计洪水位提前0.30米"}
      check_flood_warning_level_m: {type: float, default: 248.61, description: "接近校核洪水位的提示阈值，米；按校核洪水位提前0.30米"}
      longitude: {type: float, description: "经度"}
