    properties:
      evacuation_unit_id: {type: str, required: true, description: "转移单元稳定ID"}
      name: {type: str, description: "规范显示名，如新民村转移单元"}
      source_name: {type: str, description: "原始数据中的村庄或转移对象名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      population: {type: int, description: "转移人口数"}
      town_id: {type: str, description: "所属乡镇编码"}
      town_name: {type: str, description: "所属乡镇名称"}
      county_id: {type: str, description: "所属县编码"}
