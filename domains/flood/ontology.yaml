# 水路联动领域契约；对象与工具名称为稳定接口。
name: flood

description: "水库下游洪水、道路桥梁、重要设施与避洪转移联动分析领域。面向珊瑚河数据，回答洪水事件中哪些道路、桥梁、设施、转移路线和安置对象受影响，以及应采取哪些封控、撤离、绕行和简报建议。"

excluded_tools: [mutate, apply_rule, apply_rule_batch, dispatch_workers]

tool_preferences:
  generic_search: fallback_only

# 业务对象：静态台账、运行结果与已发指令。
objects:
  River:
    kind: entity
    display_name: "珊瑚河"
    aliases:
      - {terms: ["珊瑚河", "主河道", "河道中心线"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: river_id
    summary: "河流主体"
    description: "River 表达珊瑚河这个河流主体，是水文、洪水过程、水利工程和流域对象的关联中心。流域范围由 Watershed 表达。"
    properties:
      river_id: {type: str, required: true, description: "河流编号，如 shanhu"}
      name: {type: str, description: "河流名称"}
      water_system: {type: str, description: "所属水系"}
      watershed_id: {type: str, description: "默认关联的流域编号"}
      watershed_name: {type: str, description: "默认关联的流域名称"}

  Watershed:
    kind: entity
    display_name: "珊瑚河流域"
    aliases:
      - {terms: ["流域", "小流域", "流域范围"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: watershed_id
    summary: "河流流域范围"
    description: "Watershed 表达珊瑚河流域范围及相关小流域，是河流、行政区、水系和风险对象的空间语义范围。"
    properties:
      watershed_id: {type: str, required: true, description: "流域编号，如 shanhu_watershed"}
      river_id: {type: str, description: "所属河流编号"}
      name: {type: str, description: "流域名称"}
      watershed_type: {type: str, description: "流域类型，如 flood_risk_basin/small_watershed"}
      area_km2: {type: float, description: "流域面积，若数据可得"}

  Catchment:
    kind: entity
    countable: true
    display_name: "水库集水区"
    aliases:
      - {terms: ["集水区", "汇水区", "水库上游集水区", "龙潭水库上游集水区"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: catchment_id
    summary: "水库上游降雨汇集范围"
    description: "Catchment 为降雨产流和水库入流计算提供空间范围与面积，通过 reservoir_id 关联水库。独立保留源边界，不代表预测淹没区。"
    properties:
      catchment_id: {type: str, required: true, description: "集水区编号"}
      name: {type: str, description: "集水区名称"}
      reservoir_id: {type: str, description: "汇入的水库编号"}
      reservoir_name: {type: str, description: "汇入的水库名称"}
      river_id: {type: str, description: "关联河流编号"}
      rainfall_field: {type: str, description: "对应的分区面雨量输入字段"}
      area_km2: {type: float, description: "源数据集水面积，平方千米；用于产流计算"}
      area_source: {type: str, description: "面积来源与计量方法"}
      geodesic_area_km2: {type: float, description: "按 WGS84 椭球复核的面积，平方千米"}
      source_file: {type: str, description: "源边界文件名"}
      source_crs: {type: str, description: "源坐标系"}
      boundary_review_status: {type: str, description: "边界核对状态，source_boundaries_differ 表示与原始流域边界有差异"}
      data_note: {type: str, description: "来源及空间边界使用说明"}

  HydrodynamicBoundary:
    kind: entity
    display_name: "水动力边界"
    aliases:
      - {terms: ["水动力边界", "模型边界", "断面"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: boundary_id
    summary: "水动力模型边界和断面位置"
    description: "表达水动力模型中上游入流、沿程入流、支流入流、下游水位边界以及断面位置，用于解释模型输入边界与计算断面的业务角色。"
    properties:
      boundary_id: {type: str, required: true, description: "水动力边界对象编号"}
      river_id: {type: str, description: "所属河流编号"}
      name: {type: str, description: "边界或断面名称"}
      source_name: {type: str, description: "原始数据中的边界或断面名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      boundary_group: {type: str, description: "边界分组: upstream/interval1/interval2/tonggu/waterlevel"}
      boundary_type: {type: str, description: "原始边界类型或水动力输入类型"}
      boundary_role: {type: str, description: "业务角色: upstream_inflow/lateral_inflow/tributary_inflow/downstream_water_level"}
      is_model_input_boundary: {type: bool, description: "是否为 CNN 水动力模型的 4 个流量输入边界之一"}
      section_code: {type: str, description: "断面编号，若来源为断面位置"}
      flow_node: {type: str, description: "水动力模型 FlowNode 编号，若源数据提供"}

  County:
    kind: entity
    countable: true
    display_name: "县级行政区"
    aliases:
      - {terms: ["县级边界", "行政边界", "县"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: county_id
    summary: "县级行政区"
    description: "County 表达县级行政区，领域分析时以县为行政责任和统计单元。"
    properties:
      county_id: {type: str, required: true, description: "县级行政区编码"}
      river_id: {type: str, description: "关联河流编号，当前用于表达珊瑚河流域涉及的县"}
      name: {type: str, description: "县名"}
      adcode: {type: str, description: "行政区划代码"}

  Town:
    kind: entity
    countable: true
    display_name: "乡镇"
    aliases:
      - {terms: ["乡镇", "乡镇边界", "镇界"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: town_id
    summary: "乡镇及灾前暴露信息"
    description: "由灾前信息表、转移单元和安置点中的 OwnerTown 字段共同支撑。人口、GDP、产业和房屋财产暴露信息作为 Town 属性。"
    properties:
      town_id: {type: str, required: true, description: "乡镇编码或稳定ID"}
      name: {type: str, description: "乡镇名称"}
      county_id: {type: str, description: "所属县编码"}
      adcode: {type: str, description: "乡镇行政区划代码"}
      population: {type: int, description: "常住人口"}
      gdp_10k_cny: {type: float, description: "GDP，万元"}
      agriculture_10k_cny: {type: float, description: "农林牧渔业产值，万元"}
      housing_property_10k_cny: {type: float, description: "居民房屋及室内财产，万元"}
      transport_industry_10k_cny: {type: float, description: "交通运输业产值，万元"}
      commerce_10k_cny: {type: float, description: "商贸服务业产值，万元"}

  Reservoir:
    kind: entity
    countable: true
    display_name: "水库"
    aliases:
      - {terms: ["水库"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: reservoir_id
    summary: "水库工程"
    description: "水库工程台账及安全阈值。动态水位和调度过程由运行时生成；本对象不提供 reservoir_level_m，预测起点的调度状态通过 get_longtan_dispatch_plan 查询。"
    properties:
      reservoir_id: {type: str, required: true, description: "水库编号"}
      name: {type: str, description: "水库名称"}
      river_id: {type: str, description: "所在河流编号"}
      county_id: {type: str, description: "所在县编码"}
      town_name: {type: str, description: "所在乡镇"}
      capacity_10k_m3: {type: float, description: "总库容，万立方米"}
      dam_top_elevation_m: {type: float, description: "坝顶高程"}
      design_flood_standard_year: {type: float, description: "设计洪水标准，年一遇"}
      check_flood_standard_year: {type: float, description: "校核洪水标准，年一遇"}
      max_discharge_m3s: {type: float, description: "最大泄量"}
      safety_status: {type: str, description: "安全状态或安全类别"}
      normal_pool_level_m: {type: float, default: &normal_pool_level_m 245.30, description: "正常蓄水位，米；低于该值显示绿色，达到后显示黄色"}
      design_flood_level_m: {type: float, default: &design_flood_level_m 247.92, description: "设计洪水位，米；达到后显示橙色"}
      check_flood_level_m: {type: float, default: &check_flood_level_m 248.91, description: "校核洪水位，米；超过后显示红色严重警告"}
      design_flood_warning_level_m: {type: float, default: &design_flood_warning_level_m 247.62, description: "接近设计洪水位的提示阈值，米；按设计洪水位提前0.30米"}
      check_flood_warning_level_m: {type: float, default: &check_flood_warning_level_m 248.61, description: "接近校核洪水位的提示阈值，米；按校核洪水位提前0.30米"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  Sluice:
    kind: entity
    countable: true
    display_name: "水闸"
    aliases:
      - {terms: ["水闸", "分洪闸", "闸门"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: sluice_id
    summary: "水闸或分洪闸"
    description: "水闸对象用于表达分洪、泄洪、灌区闸门等工程及后续调度运行状态。"
    properties:
      sluice_id: {type: str, required: true, description: "水闸编号"}
      name: {type: str, description: "水闸名称"}
      source_name: {type: str, description: "原始台账中的水闸名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      river_id: {type: str, description: "所在河流编号"}
      county_id: {type: str, description: "所在县编码"}
      town_name: {type: str, description: "所在乡镇"}
      sluice_type: {type: str, description: "水闸类型，如分洪闸、节制闸"}
      gate_count: {type: int, description: "闸孔数"}
      design_discharge_m3s: {type: float, description: "设计过闸流量或分泄流量"}
      source_record_ids: {type: str, description: "合并前的源记录ID，以逗号分隔"}
      source_record_count: {type: int, description: "合并到该水闸实体的源记录数"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  HydraulicStructure:
    kind: entity
    display_name: "其他水利工程"
    aliases:
      - {terms: ["水利设施", "水利工程", "水利工程设施"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: structure_id
    summary: "其他水利工程设施"
    description: "堤防、泵站、溢流建筑物等暂统一为 HydraulicStructure，后续若业务需要再拆成更细对象。"
    properties:
      structure_id: {type: str, required: true, description: "水利工程设施ID"}
      name: {type: str, description: "设施名称"}
      source_name: {type: str, description: "原始台账中的设施名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      structure_type: {type: str, description: "设施类型: levee/pump_station/spillway/other"}
      river_id: {type: str, description: "所在河流编号，若可识别"}
      river_name: {type: str, description: "所在河流名称，若可识别"}
      town_id: {type: str, description: "工程代表点所在乡镇编码，由空间匹配得到"}
      town_name: {type: str, description: "工程代表点所在乡镇名称，由空间匹配得到"}
      county_id: {type: str, description: "所属县编码，若可识别"}
      location: {type: str, description: "位置描述"}
      length_m: {type: float, description: "长度，适用于堤防等线状工程"}
      elevation_m: {type: float, description: "高程，若可得"}
      flow_m3s: {type: float, description: "流量，适用于泵站/泄洪设施"}
      source_record_ids: {type: str, description: "合并前的源记录定位符，以逗号分隔"}
      source_record_count: {type: int, description: "合并到该工程实体的源记录数"}
      longitude: {type: float, description: "经度，点状设施或代表点"}
      latitude: {type: float, description: "纬度，点状设施或代表点"}


  Road:
    kind: entity
    countable: true
    display_name: "路段"
    aliases:
      - {terms: ["路段"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_id
    summary: "道路路段"
    description: "Road 表达独立几何路段，保留原始 road_id。包括未能归属编号道路的路段；通过 RoadRouteSegment 多对多关联 RoadRoute。"
    properties:
      road_id: {type: str, required: true, description: "路段稳定ID"}
      road_route_ids: {type: list, description: "按规范 ref 归属的 RoadRoute ID 列表；空列表表示未归属"}
      name: {type: str, description: "道路名称"}
      source_name: {type: str, description: "原始路网中的道路名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      ref: {type: str, description: "道路编号，如 G65、G78、G241"}
      county_id: {type: str, description: "道路代表点所在县编码；边界附近道路允许按500米容差归属最近县"}
      road_class: {type: str, description: "道路等级或 fclass"}
      one_way: {type: str, description: "单向/双向标记"}
      bridge_flag: {type: bool, description: "该路段是否标记为桥上路段"}
      tunnel_flag: {type: bool, description: "该路段是否标记为隧道路段"}
      length_m: {type: float, description: "道路长度，米"}

  RoadRoute:
    kind: entity
    countable: true
    display_name: "编号道路"
    aliases:
      - {terms: ["道路", "公路"]}
    data_source: derived
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_route_id
    summary: "由多个已收录路段组成的编号道路"
    description: "仅按 Road.ref 的可靠编号聚合，不根据同名或邻近关系猜测归属。几何为成员路段的 MultiLineString，可不连续，包含双向线和已标号匝道，不保证拓扑连通或覆盖整条道路。名称取单一编号路段的众数，缺失时回退所有成员名称众数或编号，不代表官方名称核定。"
    properties:
      road_route_id: {type: str, required: true, description: "稳定ID，如 road_route_G65"}
      ref: {type: str, description: "单一道路编号，如 G65"}
      name: {type: str, description: "从成员路段推导的显示名称"}
      name_source: {type: str, description: "显示名称选取依据"}
      source_names: {type: list, description: "成员中出现的名称，保留名称差异"}
      road_category: {type: str, description: "expressway/other/mixed；按路段等级而非编号前缀判断"}
      road_class: {type: str, description: "成员路段最常见的等级"}
      road_ids: {type: list, description: "已收录成员路段ID，可用 Road.road_id__in 查询"}
      segment_count: {type: int, description: "已收录路段数量"}
      geometry_segment_count: {type: int, description: "具有可展示线几何的成员路段数量"}
      shared_segment_count: {type: int, description: "同时属于其他编号道路的路段数量"}
      recorded_length_m: {type: float, description: "已收录路段长度之和，含双向线及匝道，不是道路里程或全长"}
      membership_basis: {type: str, description: "归属依据 Road.ref"}
      coverage_scope: {type: str, description: "仅包含项目已收录路段"}

  RoadRouteSegment:
    kind: entity
    countable: false
    display_name: "道路与路段关联"
    data_source: derived
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_route_segment_id
    summary: "编号道路与路段的多对多关联"
    description: "一个路段可归属于多条编号道路；无可靠编号的路段不自动关联。先从道路或路段查询关联，再通过关联取得另一端对象。"
    properties:
      road_route_segment_id: {type: str, required: true, description: "道路与路段组合稳定ID"}
      road_route_id: {type: str, description: "RoadRoute ID"}
      road_id: {type: str, description: "Road ID"}
      ref: {type: str, description: "关联的单一道路编号"}
      membership_basis: {type: str, description: "归属依据 Road.ref"}

  Bridge:
    kind: entity
    countable: true
    display_name: "桥梁"
    aliases:
      - {terms: ["桥梁", "桥"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: bridge_id
    summary: "桥梁"
    description: "Bridge 表达桥梁及其通行风险相关属性。现有台账字段可能缺失，因此风险评估需要标注资料质量。"
    properties:
      bridge_id: {type: str, required: true, description: "桥梁稳定ID"}
      name: {type: str, description: "桥梁名称"}
      source_name: {type: str, description: "原始台账中的桥梁名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      river_id: {type: str, description: "所在河流编号"}
      length_m: {type: float, description: "桥长"}
      width_m: {type: float, description: "桥宽"}
      deck_elevation_m: {type: float, description: "桥面或梁底高程，若可得"}
      data_quality: {type: str, description: "台账完整性: complete/partial/missing"}
      source_record_ids: {type: str, description: "合并前的源记录ID，以逗号分隔"}
      source_record_count: {type: int, description: "合并到该桥梁实体的源记录数"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  Facility:
    kind: entity
    countable: true
    display_name: "重要设施"
    aliases:
      - {terms: ["重要设施", "设施"]}
      - {terms: ["学校"], filters: {facility_type: school}}
      - {terms: ["医院"], filters: {facility_type: hospital}}
      - {terms: ["政府机构"], filters: {facility_type: government}}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: facility_id
    summary: "重要设施"
    description: "医院、学校、政府等重要设施统一建模为 Facility，通过 facility_type 区分。"
    properties:
      facility_id: {type: str, required: true, description: "设施ID"}
      name: {type: str, description: "设施名称"}
      source_name: {type: str, description: "原始数据中的设施名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      duplicate_source_name_count: {type: int, description: "原始同名记录数；大于1时显示名已消歧"}
      facility_type: {type: str, description: "设施类型: hospital/school/government/other"}
      subtype: {type: str, description: "细分类型，如卫生院、小学、政府机构"}
      address: {type: str, description: "地址"}
      town_id: {type: str, description: "设施所在乡镇编码，由设施点与乡镇边界空间匹配得到"}
      town_name: {type: str, description: "所在乡镇，若可推断"}
      county_id: {type: str, description: "所属县编码"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  EvacuationSite:
    kind: entity
    countable: true
    display_name: "安置地点"
    aliases:
      - {terms: ["安置点", "安置地点"]}
      - {terms: ["就地安置点"], filters: {site_type: in_place}}
      - {terms: ["集中安置点"], filters: {site_type: shelter}}
      - {terms: ["集合点"], filters: {site_type: assembly}}
      - {terms: ["物资点"], filters: {site_type: warehouse}}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: evacuation_site_id
    summary: "安置或应急地点"
    description: "本库包含集中安置点（site_type=shelter）和就地安置点（site_type=in_place）；其他用途不能直接当作安置点统计。"
    properties:
      evacuation_site_id: {type: str, required: true, description: "安置地点稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始数据中的名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      site_type: {type: str, description: "地点类型: shelter/in_place/assembly/warehouse/medical"}
      town_id: {type: str, description: "所属乡镇编码"}
      town_name: {type: str, description: "所属乡镇名称"}
      county_id: {type: str, description: "所属县编码"}
      area_m2: {type: float, description: "面积，平方米"}
      capacity_person: {type: int, description: "可容纳人数"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  EvacuationUnit:
    kind: entity
    countable: true
    display_name: "转移单元"
    aliases:
      - {terms: ["转移对象", "转移安排", "转移单元", "需转移村庄"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: evacuation_unit_id
    summary: "需要组织转移的人口单元"
    description: "EvacuationUnit 表达转移路线的起点及其人口、属地和预案洪水到达窗口；路线与安置地点通过 EvacuationRoute 关联。"
    properties:
      evacuation_unit_id: {type: str, required: true, description: "转移单元稳定ID"}
      name: {type: str, description: "规范显示名，如新民村转移单元"}
      source_name: {type: str, description: "原始数据中的村庄或转移对象名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      population: {type: int, description: "转移人口数"}
      town_id: {type: str, description: "所属乡镇编码"}
      town_name: {type: str, description: "所属乡镇名称"}
      county_id: {type: str, description: "所属县编码"}
      flood_arrival_window: {type: str, description: "预案中的洪水到达窗口，如 0-12、12-24；不是预测分析结论"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}

  EvacuationRoute:
    kind: entity
    display_name: "转移路线"
    aliases:
      - {terms: ["路线", "路径", "转移路线", "绕行路线"]}
    data_source: mixed
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: evacuation_route_id
    summary: "连接转移单元与安置地点的路线"
    description: "预定或动态规划路线，支持领域对象或明确坐标作为起终点；坐标终点可没有 destination_site_id。通过 route_type 区分导航、转移、救援、绕行和保障。对象查询只读，动态路线由 plan_route 保存。"
    properties:
      evacuation_route_id: {type: str, required: true, description: "转移路线稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始数据中的路线名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      route_type: {type: str, description: "路线类型: navigation/transfer/rescue/detour/supply"}
      road_detail: {type: str, description: "路线道路描述"}
      origin_unit_id: {type: str, description: "起点转移单元ID；非转移单元起点的动态路线可为空"}
      destination_site_id: {type: str, description: "终点安置地点ID"}
      population: {type: int, description: "服务或转移人口"}
      length_m: {type: float, description: "路线长度，米"}
      duration_s: {type: float, description: "预计通行时间，秒"}
      status: {type: str, description: "路线状态，如 planned/approved/blocked"}
      routing_engine: {type: str, description: "路线计算引擎"}
      candidate_count: {type: int, description: "高德返回的候选路线数量"}
      selected_candidate_index: {type: int, description: "最终采用的高德候选路线序号，从1开始"}
      rejected_candidate_count: {type: int, description: "因涉水或校验失败被排除的候选路线数量"}
      profile: {type: str, description: "路由交通模式，如 car/foot"}
      flood_validation: {type: str, description: "initial_dry 演示初始无洪水 / checked 已按有效预测校核"}
      forecast_id: {type: str, description: "规划依据的洪水预测ID"}
      time_h: {type: float, description: "规划依据的预测时刻，小时"}
      blocked_depth_m: {type: float, description: "道路禁行水深阈值，米"}
      start_endpoint_distance_m: {type: float, description: "高德路线起点到领域对象起点的距离，米"}
      destination_endpoint_distance_m: {type: float, description: "高德路线终点到目标地点的距离，米"}
      max_endpoint_distance_m: {type: float, description: "路线端点允许偏离领域对象坐标的最大距离，米"}
      detour_ratio: {type: float, description: "路线长度与起终点直线距离之比"}
      start_object_type: {type: str, description: "起点对象类型"}
      start_object_id: {type: str, description: "起点对象ID"}
      instructions: {type: json, description: "路线逐步导航信息 JSON 数组，每步包含 text、street_name、distance、time"}

  FloodForecast:
    kind: entity
    display_name: "洪水预测"
    aliases:
      - {terms: ["预测运行", "洪水预测"]}
    data_source: model_generated
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: forecast_id
    summary: "一次洪水预测及其结果摘要"
    description: "FloodForecast 表示一次水文-水动力联动预测运行，记录水文边界、模型名称、生成时间和预测淹没统计；模型原始输出保存在所属演进工作空间。"
    properties:
      forecast_id: {type: str, required: true, description: "预测运行ID，如 v001；latest 仅作为查询当前最新预测的别名"}
      forecast_version: {type: str, description: "当前演进内的预测版本，如 v001"}
      forecast_sequence: {type: int, description: "当前演进内的预测顺序号"}
      workspace_id: {type: str, description: "保存本次预测的当前演进工作空间ID"}
      name: {type: str, description: "预测运行名称"}
      status: {type: str, description: "运行状态"}
      model_name: {type: str, description: "模型名称"}
      model_description: {type: str, description: "模型说明"}
      generated_at: {type: str, description: "生成时间"}
      forecast_time: {type: str, description: "本次预测的起报或触发时间"}
      valid_from: {type: str, description: "预测结果有效时段起点"}
      valid_to: {type: str, description: "预测结果有效时段终点"}
      trigger_reason: {type: str, description: "触发本次预测的领域策略原因"}
      is_latest: {type: bool, description: "是否为当前演进的最新预测"}
      lead_time_h: {type: float, description: "预见期，小时"}
      mesh_source_id: {type: str, description: "作为计算网格来源的水动力网格集合"}
      hydrology_inputs: {type: str, description: "水文边界条件 JSON"}
      forcing_index: {type: float, description: "综合水文边界强度，仅作为模型内部无量纲输入"}
      forecast_cell_count: {type: int, description: "预测有水深的单元数量"}
      inundated_area_km2: {type: float, description: "预测淹没面积，平方千米"}
      max_depth_m: {type: float, description: "最大预测水深，米"}
      mean_depth_m: {type: float, description: "平均预测水深，米"}

  EmergencyDirective:
    kind: entity
    countable: true
    display_name: "应急指令"
    aliases:
      - {terms: ["应急指令", "已发指令", "指令记录"]}
    data_source: human_confirmed
    mutability: append_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: directive_id
    summary: "当前演进中经用户确认发出的应急指令"
    description: "EmergencyDirective 只表示已经由用户在态势工作台确认发出的指令；智能体生成但尚未确认的前端初稿不作为领域对象保存。"
    properties:
      directive_id: {type: str, required: true, description: "指令编号"}
      workspace_id: {type: str, description: "所属当前演进工作空间ID"}
      title: {type: str, description: "指令标题"}
      content: {type: str, description: "指令正文"}
      recipients: {type: str, description: "接收对象"}
      priority: {type: str, description: "优先级: normal/urgent/critical"}
      status: {type: str, description: "指令状态，当前为 issued"}
      simulation_time: {type: str, description: "发出时的演进模拟时间"}
      forecast_version: {type: str, description: "发出时运行状态记录的预测版本；不证明正文采用或校验了该版本"}
      issued_at: {type: str, description: "用户确认发出时间"}

  InundationForecastCell:
    kind: entity
    display_name: "淹没预测单元"
    data_source: derived
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: forecast_cell_id
    summary: "指定洪水预测下的淹没网格结果"
    description: "由静态网格与指定预测切片或最大包络按需派生。CNN 提供水深；流速由水深估算并标明来源。未计算的到水/退水时刻、地面高程、水位和河道距离返回 null，不可作为预测证据。"
    properties:
      forecast_cell_id: {type: str, required: true, description: "预测计算单元ID"}
      forecast_id: {type: str, description: "所属预测运行ID"}
      model_name: {type: str, description: "输出该单元的模型名称"}
      mesh_cell_id: {type: str, description: "基础计算网格单元ID"}
      mesh_source_id: {type: str, description: "基础网格来源"}
      time_h: {type: float, description: "相对 valid_from 的切片小时偏移；最大包络为 null"}
      view: {type: str, description: "结果范围：time_slice 或 envelope"}
      lead_time_h: {type: float, description: "兼容字段，与 time_h 相同；不是到水时间，包络为 null"}
      centroid_lon: {type: float, description: "单元中心经度"}
      centroid_lat: {type: float, description: "单元中心纬度"}
      distance_to_river_m: {type: float, description: "到河道中心线距离，米；当前未计算，返回 null"}
      ground_elevation_m: {type: float, description: "地面高程，米；当前未接入，返回 null"}
      water_level_m: {type: float, description: "绝对水位，米；当前缺少地面高程，返回 null，不能用水深替代"}
      depth_m: {type: float, description: "预测水深，米"}
      depth_source: {type: str, description: "水深来源，当前为 cnn_prediction"}
      velocity_mps: {type: float, description: "按水深公式估算的流速，米每秒；不是 CNN 输出或实测值"}
      velocity_source: {type: str, description: "流速来源，当前为 depth_estimate"}
      arrival_time_h: {type: float, description: "首次到水相对 valid_from 的小时偏移；当前未计算，返回 null"}
      recession_time_h: {type: float, description: "退水相对 valid_from 的小时偏移；当前未计算，返回 null"}
      risk_level: {type: str, description: "按预测水深与估算流速派生的风险等级"}
      risk_basis: {type: str, description: "风险分级依据，当前为 depth_and_estimated_velocity"}
      area_m2: {type: float, description: "单元面积，平方米"}

  HydrodynamicGridCell:
    kind: entity
    display_name: "水动力网格单元"
    aliases:
      - {terms: ["水动力网格", "模型网格", "GT.txt 网格", "预测淹没结果"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: hydrodynamic_cell_id
    summary: "水动力模型网格单元"
    description: "HydrodynamicGridCell 是水动力模型的静态三角网格计算单元，可承载某次预测对应的最大水深结果。"
    properties:
      hydrodynamic_cell_id: {type: str, required: true, description: "水动力网格单元ID"}
      cell_id: {type: int, description: "模型原始 cell 编号"}
      depth_m: {type: float, description: "模型输出最大水深，米；0 表示无水"}
      is_flooded: {type: bool, description: "是否有水深"}

  Station:
    kind: entity
    display_name: "测站"
    aliases:
      - {terms: ["测站", "监测站", "雨量站", "水位站"]}
      - {terms: ["山洪测站", "山洪站"], filters: {station_type: flash_flood}}
      - {terms: ["气象测站", "气象站"], filters: {station_type: meteorological}}
      - {terms: ["水文测站", "水文站"], filters: {station_type: hydrological}}
      - {terms: ["水库测站", "水库站"], filters: {station_type: reservoir}}
    countable: true
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: station_id
    summary: "山洪、气象、水文或水库测站"
    description: "表达珊瑚河流域测站。station_type 支持 flash_flood、meteorological、hydrological、reservoir；当前对象库包含有坐标的山洪、气象、水文测站以及龙潭水库站。"
    properties:
      station_id: {type: str, required: true, description: "测站ID，当前直接采用源测站编码"}
      station_code: {type: str, required: true, description: "源测站编码"}
      river_id: {type: str, description: "关联河流编号"}
      reservoir_id: {type: str, description: "水库测站关联的水库编号"}
      name: {type: str, description: "测站名称"}
      station_type: {type: str, description: "测站类型: flash_flood/meteorological/hydrological/reservoir"}
      station_type_name: {type: str, description: "测站类型中文名称"}
      source_system: {type: str, description: "源表中的数据来源系统: 山洪/气象/水文/水库"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}
      observation_items: {type: str, description: "已知观测项目；当前清单来自雨量站工作表"}
      coordinate_quality: {type: str, description: "坐标质量说明；源文件未声明坐标系，当前按 WGS84 用于 GeoJSON 展示，后续需校核"}

  DangerArea:
    kind: entity
    display_name: "危险区"
    aliases:
      - {terms: ["危险区", "风险点", "风险区"]}
    data_source: local_file
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: danger_area_id
    summary: "静态危险区台账对象"
    description: "表达本地危险区台账中的静态空间点。预测淹没影响由 analyze_inundation_impacts 动态计算，不写入 DangerArea 对象库。"
    properties:
      danger_area_id: {type: str, required: true, description: "危险区稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始台账中的自然村名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      danger_area_type: {type: str, description: "危险区类型，当前为 flood_danger_area"}
      risk_level: {type: str, description: "风险等级: low/medium/high/critical/unknown"}
      city: {type: str, description: "所在市"}
      county_name: {type: str, description: "所在县区"}
      town_name: {type: str, description: "所在乡镇"}
      village_committee: {type: str, description: "行政村"}
      natural_village: {type: str, description: "自然村或自然屯"}
      longitude: {type: float, description: "经度"}
      latitude: {type: float, description: "纬度"}
      evidence: {type: str, description: "风险判断依据"}
      data_quality: {type: str, description: "证据质量，当前为 table_record"}
      recommended_action: {type: str, description: "建议动作摘要"}

# 对象关联：允许未归属路段与坐标终点。
links:
  road_route_segments:
    source: RoadRoute
    target: RoadRouteSegment
    join: {source_key: road_route_id, target_key: road_route_id}
    description: "编号道路的全部成员关联"
    link_type: contains
    cardinality: 1..n

  road_segment_routes:
    source: Road
    target: RoadRouteSegment
    join: {source_key: road_id, target_key: road_id}
    description: "路段所属编号道路的全部关联，允许共线"
    link_type: relates
    cardinality: 0..n

  road_membership_segment:
    source: RoadRouteSegment
    target: Road
    join: {source_key: road_id, target_key: road_id}
    description: "关联对应的原始路段"
    link_type: relates
    cardinality: n..1

  road_membership_route:
    source: RoadRouteSegment
    target: RoadRoute
    join: {source_key: road_route_id, target_key: road_route_id}
    description: "关联对应的编号道路"
    link_type: relates
    cardinality: n..1

  river_watersheds:
    source: River
    target: Watershed
    join: {source_key: river_id, target_key: river_id}
    description: "河流关联的流域范围"
    link_type: contains
    cardinality: 1..n

  river_counties:
    source: Watershed
    target: County
    join: {source_key: river_id, target_key: river_id}
    description: "流域涉及的县级行政区，当前可由空间叠加或配置生成"
    link_type: contains
    cardinality: 1..n

  county_towns:
    source: County
    target: Town
    join: {source_key: county_id, target_key: county_id}
    description: "县包含乡镇"
    link_type: contains
    cardinality: 1..n

  river_reservoirs:
    source: River
    target: Reservoir
    join: {source_key: river_id, target_key: river_id}
    description: "河流关联水库"
    link_type: relates
    cardinality: 1..n

  reservoir_catchments:
    source: Reservoir
    target: Catchment
    join: {source_key: reservoir_id, target_key: reservoir_id}
    description: "水库入流来源的上游集水区"
    link_type: relates
    cardinality: 1..n

  catchment_reservoir:
    source: Catchment
    target: Reservoir
    join: {source_key: reservoir_id, target_key: reservoir_id}
    description: "集水区汇入的水库"
    link_type: relates
    cardinality: n..1

  river_sluices:
    source: River
    target: Sluice
    join: {source_key: river_id, target_key: river_id}
    description: "河流关联水闸"
    link_type: relates
    cardinality: 1..n

  river_hydraulic_structures:
    source: River
    target: HydraulicStructure
    join: {source_key: river_id, target_key: river_id}
    description: "河流关联的堤防、泵站、溢流建筑物等水利工程设施"
    link_type: relates
    cardinality: 1..n

  river_stations:
    source: River
    target: Station
    join: {source_key: river_id, target_key: river_id}
    description: "河流关联的山洪、气象、水文和水库测站"
    link_type: observes
    cardinality: 1..n

  evacuation_unit_routes:
    source: EvacuationUnit
    target: EvacuationRoute
    join: {source_key: evacuation_unit_id, target_key: origin_unit_id}
    description: "转移单元关联的预定、备选或动态规划路线；尚未收录或规划时可为空"
    link_type: enables
    cardinality: 0..n

  evacuation_route_destination:
    source: EvacuationRoute
    target: EvacuationSite
    join: {source_key: destination_site_id, target_key: evacuation_site_id}
    description: "路线通向的安置地点；明确坐标终点可无该关联"
    link_type: enables
    cardinality: 0..1

# 运行时水库监测规则：由 reservoir_monitoring 注入动态 reservoir_level_m。
# Agent 不通过静态 Reservoir 台账直接应用规则；阈值引用对象默认值，避免两处改写。
rules:
  reservoir_level_status:
    description: "根据龙潭水库水位判定地图和图表使用的确定性颜色等级"
    rule_type: classification
    applies_to: [Reservoir]
    result_field: level_status
    source: "龙潭水库正常蓄水位、设计洪水位和校核洪水位"
    conditions:
      - field: reservoir_level_m
        operator: gt
        value: *check_flood_level_m
        result: {key: critical, label: "超校核洪水位", color: "#c62828"}
      - field: reservoir_level_m
        operator: gte
        value: *design_flood_level_m
        result: {key: danger, label: "设计洪水位以上", color: "#e66a19"}
      - field: reservoir_level_m
        operator: gte
        value: *normal_pool_level_m
        result: {key: warning, label: "正常蓄水位以上", color: "#c99700"}
      - field: reservoir_level_m
        operator: lt
        value: *normal_pool_level_m
        result: {key: normal, label: "正常", color: "#238b57"}

  reservoir_level_alert:
    description: "按当前至未来24小时预测最高水位返回唯一且最高级别的水库调度提示"
    rule_type: threshold
    applies_to: [Reservoir]
    result_field: alert
    source: "龙潭水库设计洪水位和校核洪水位；接近阈值统一提前0.30米"
    conditions:
      - field: reservoir_level_m
        operator: gt
        value: *check_flood_level_m
        result:
          severity: critical
          text: "警告：水位超校核洪水位！大坝安全面临严峻考验"
          future_text_template: "警告：水位将在{triggered_at}超校核洪水位！大坝安全面临严峻考验"
          current_text_template: "警告：水位已于{triggered_at}超校核洪水位！大坝安全面临严峻考验"
      - field: reservoir_level_m
        operator: gte
        value: *check_flood_warning_level_m
        result:
          severity: danger
          text: "入库流量持续加大，水位逼近校核洪水位"
          future_text_template: "入库流量持续加大，水位将在{triggered_at}逼近校核洪水位"
          current_text_template: "入库流量持续加大，水位已于{triggered_at}逼近校核洪水位"
      - field: reservoir_level_m
        operator: gte
        value: *design_flood_warning_level_m
        result:
          severity: warning
          text: "为保障大坝安全，按泄洪设施下泄能力下泄"
          future_text_template: "预计水位将在{triggered_at}接近设计洪水位。为保障大坝安全，按泄洪设施下泄能力下泄"
          current_text_template: "水位已于{triggered_at}接近设计洪水位。为保障大坝安全，按泄洪设施下泄能力下泄"

# 领域工具：输入、用途与执行策略。
functions:
  # required: false 表示可省略；省略时使用 Python 默认值，空数组仍表示空范围。
  # tool_policy 声明执行与缓存语义，json_schema 声明枚举、数组元素及嵌套参数。
  # 状态与范围查询
  get_flood_status:
    summary: "只读查询当前或预测时段的淹没状态"
    description: "检查当前工作空间、演进时间、预测输入版本和有效期，返回是否存在对应预测淹没。不会生成预测、切换地图或修改演进状态。演进未开始且查询当前状态时 has_inundation=false，依据演示初始约定；开始后缺少有效预测时 has_inundation=null，不表示无淹水。"
    usage_prompt: >-
      查询对应时刻或整个预测期有没有淹没时调用，不计算预测或改变地图。
      has_inundation=null 表示无法判断，按 reason/next_step 说明原因与下一步；
      演进未开始的无洪水结论只适用于初始当前状态，不能用于未来预测。
    function_type: lookup
    involves_objects: [FloodForecast, InundationForecastCell]
    params:
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      view: {type: str, description: "对话中 current 为本轮分析时刻 / time_slice 指定时刻 / simulation_current 演进时刻 / envelope 预测最大包络", default: "current", json_schema: {enum: [current, time_slice, simulation_current, envelope]}}
      time_h: {type: float, description: "view=time_slice 时的预测偏移小时数", required: false}

  find_nearby_objects:
    summary: "查询参考对象附近的点位"
    description: "按对象代表位置的 WGS84 直线距离筛选并排序附近对象；返回范围、距离、数量和可直接展示的 ID。不是名称匹配，也不是道路通行距离。"
    usage_prompt: >-
      先用 query 确定参考对象 ID，再查询附近点位及直线距离；不是道路通行距离。
      默认半径3000米、每页10个；用户指定时采用其范围，计数直接用 total_matched。
      page_set 是本页，matching_set 是全部匹配。展示全部或分析整个范围可直接传 matching_set，
      无需翻页抄写 ID；只有需要逐项读取明细时才用 next_offset 翻页至 has_more=false。
      “更远”使用 min_distance_m 或 exclude_object_ids，避免再次返回同一批最近对象。
      filters 可筛选类别、地域及名称。集合保存失败时，本页用 object_ids，全范围用 matching_object_ids。
    function_type: lookup
    involves_objects: [EvacuationUnit, EvacuationSite, Station, Facility, Bridge, Sluice, HydraulicStructure, Reservoir]
    max_result_chars: 32000
    params:
      reference_object_type: {type: str, description: "参考对象类型，如 EvacuationUnit"}
      reference_object_id: {type: str, description: "已查询确认的参考对象 ID"}
      target_type: {type: str, description: "目标类型，如 EvacuationSite", default: "EvacuationSite"}
      radius_m: {type: float, description: "查询半径，米，必须大于0", default: 3000}
      limit: {type: int, description: "每页数量，1至100；统计总数使用 total_matched", default: 10}
      min_distance_m: {type: float, description: "最小距离，米，与 radius_m 组成距离区间", default: 0}
      offset: {type: int, description: "跳过的匹配数量，后续页使用返回的 next_offset", default: 0}
      exclude_object_ids: {type: list, description: "排除之前已展示的对象 ID，避免更远查询重复返回", default: [], json_schema: {items: {type: string}}}
      filters: {type: dict, description: "目标类型的名称、区域或类别过滤条件；如安置点 site_type=shelter、学校 facility_type=school", default: {}}

  refine_object_set:
    summary: "在已有候选集合中继续筛选"
    description: "以当前工作空间的对象集合为输入，按属性条件和排除列表生成新的集合，保留父集合及范围依据；不会扩展为全库。"
    usage_prompt: "用户说这些里面、只保留、再排除时使用。容量超过200可用 capacity_person__gt=200。来源集合必须是上一轮已确认的 page_set/matching_set 或 visible_selections.object_set_id；不要擅自把已显示页面换成全部匹配。空集合仍保持为空。用户明确要求只保留筛选结果并更新地图时，将返回的 map_update 作为 ui_show_objects 的对象参数，精确替换原集合；只查询时不修改地图。"
    function_type: lookup
    involves_objects: [EvacuationSite, EvacuationUnit, Facility, Station]
    params:
      object_set_id: {type: str, description: "已有对象集合 ID"}
      filters: {type: dict, description: "属性条件，与原集合取交集；支持数值比较", default: {}}
      exclude_object_ids: {type: list, description: "排除的对象 ID", default: [], json_schema: {items: {type: string}}}

  # 影响分析与应急研判
  analyze_inundation_impacts:
    summary: "根据预测淹没范围分析受影响对象"
    description: "按所选预测与对象范围分析影响，返回清单、风险与数量。普通点按湿网格邻近距离匹配，道路与路线按完整线形求交，桥梁检查桥头影响区；邻近积水与直接相交分别报告。"
    usage_prompt: >-
      对指定对象范围执行确定性空间影响分析。target_type 用单个类型，范围可用 object_set_id 或 object_ids，
      并可叠加 filters 取交集；空 ID 列表不评估对象。analysis_scope 与 total_impacts 均针对实际匹配范围。
      分析某村周边点位先用 find_nearby_objects 取得范围，不能用全类结果代替。
      Road/EvacuationRoute 按完整线形与达标湿网格多边形求交；impacts 计相交对象，
      nearby_impacts 仅为 max_distance_m 内的邻近积水，不能计入受淹数量。
      depth_m 来自相交网格，overlap_length_m 为相交长度，intersecting_mesh_cell_ids 保留证据。
      structure_overlap_unverified 表示桥隧路面高程未知；partial 与 linear_analysis 未评估项不表示无影响。
      RoadRoute 按路段分析再聚合；all/Road 的 road_route_impacts 为额外汇总，不计入 total_impacts。
      affected_segment_count 统计相交路段，nearby_segment_count 另列邻近路段，segment_impacts 保留成员证据。
      桥梁默认检查80米桥头影响区，depth_m/nearby_max_depth_m 为邻近洪泛区水深，不是桥面水深。
      inspection_required 表示需核查，likely_impassable 表示两侧桥头受淹；缺少高程时不声称桥梁本体已淹。
      velocity_source=depth_estimate 表示流速估算，risk_basis 说明分级依据，不将估算称为模型流速。
      用户要求展示时按 affected_object_ids 显示并高亮；预测图层传同一 forecast_id/view/time_h，
      不默认切回最新版本或时间轴首帧。邻近风险仅在明确要求时按 nearby_object_ids 展示。
      默认 min_depth_m=0.15、max_distance_m=10、bridge_influence_radius_m=80；桥梁半径仅在明确敏感性分析时调整。
    function_type: computation
    involves_objects: [FloodForecast, InundationForecastCell, RoadRoute, Road, Bridge, Facility, EvacuationRoute, EvacuationUnit, EvacuationSite, Station]
    params:
      object_set_id: {type: str, description: "评估指定查询集合；不能与 object_ids 同时传入", default: ""}
      object_ids: {type: list, description: "只评估这些对象 ID；省略则按类型和 filters；空数组不评估任何对象", required: false, json_schema: {items: {type: string}}}
      filters: {type: dict, description: "目标对象属性条件，如 town_id 或 site_type；与 ID 列表取交集", default: {}}
      view: {type: str, description: "对话中 current 为本轮分析时刻；time_slice 配合 time_h 指定切片；simulation_current 指演进时刻；envelope 指整个预测期最大包络", default: "current", json_schema: {enum: [current, time_slice, simulation_current, envelope]}}
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      target_type: {type: str, description: "分析目标类型: RoadRoute/Road/Bridge/Facility/EvacuationRoute/EvacuationUnit/EvacuationSite/Station/all", default: "all"}
      min_depth_m: {type: float, description: "纳入影响判定的最低预测水深，单位 m", default: 0.15}
      max_distance_m: {type: float, description: "普通点到湿网格中心的匹配距离；道路线形到湿网格多边形的邻近核查距离（不会扩大受淹判定），单位 m；不用于桥梁", default: 10}
      time_h: {type: float, description: "可选预测时刻，单位小时；对话中不传默认本轮分析时刻，view=envelope 使用最大包络", required: false}
      bridge_influence_radius_m: {type: float, description: "桥梁到预测湿网格多边形的桥头影响区半径，单位 m", default: 80}

  assess_flood_emergency:
    summary: "对已有预测进行单次应急研判"
    description: "读取当前有效预测的最大包络，生成预警级别、重点转移对象和处置建议。只执行一次，不运行 CNN、不启动持续演进、不发布指令。"
    usage_prompt: >-
      请求整个预测窗口的一次应急研判或处置建议时调用。使用最大包络，不表示选中帧已受淹。
      查询当前水情或当前受影响对象应分别用 get_flood_status、analyze_inundation_impacts。
      返回完整影响清单和重点建议；status=partial 时说明清单不完整，不能判定未列出的对象安全。
      缺少预测时说明不可研判，不自动运行 CNN；refresh 只更新研判汇总。
    function_type: computation
    tool_policy: {idempotent: false}
    involves_objects: [FloodForecast, InundationForecastCell, Road, EvacuationRoute, EvacuationUnit, EvacuationSite]
    params:
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      refresh: {type: bool, description: "重新计算研判汇总；不重新运行洪水预测", default: false}

  # 预测计算与调度试算
  run_flood_forecast:
    summary: "按当前演进输入运行洪水预测"
    description: "读取领域策略生成的稳定四边界流量快照，运行 CNN_V2，保存多时刻水深、最大包络与 FloodForecast 摘要，并更新正式预测版本。"
    timeout_seconds: 360
    concurrency_safe: false
    usage_prompt: >-
      明确请求运行、重算或更新预测，或自动事件策略要求计算时调用。
      输入为当前演进的稳定四边界快照；缺失时不能以历史预测替代。
      本工具生成预测结果，地图展示另行调用 ui_show_objects，不开启持续演进或自动发布指令。
      forecast_id 仅接受 latest/forecast_latest 输入别名，返回新结果的明确版本；不用于重算任意历史版本。
    function_type: computation
    tool_policy: {read_only: false, requires_confirmation: false, worker_allowed: false, idempotent: false, invalidates_cache: true}
    involves_objects: [FloodForecast, InundationForecastCell, HydrodynamicGridCell, River, Reservoir]
    params:
      forecast_id: {type: str, description: "当前预测输入别名，仅支持 latest/forecast_latest", default: "latest", json_schema: {enum: [latest, forecast_latest]}}
      force: {type: bool, description: "是否强制重新运行 CNN 洪水预测", default: false}

  get_longtan_dispatch_plan:
    summary: "查询本轮预测起点的水库调度方案"
    description: "读取所选预测的不可变输入，返回 t0 水库状态、当时采用的调度模式和参数。只读，不重新计算或修改演进。"
    usage_prompt: >-
      调度试算前读取原方案和允许调整的字段。返回所选预测 t0 的方案、初态及安全阈值；
      地图未来 t1 的水库状态不能作为试算初态。
    function_type: lookup
    involves_objects: [Reservoir, FloodForecast]
    params:
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}

  simulate_longtan_dispatch:
    summary: "从预测起点试算调度调整并比较24小时淹没影响"
    description: "固定所选预测的 t0 水库状态、来水和四边界条件，调整未来水库下泄并运行独立CNN预测，返回水库安全校核、指定 t1 和24小时包络影响对比。生成候选报告，不切换当前调度、不覆盖正式预测、不重置演进。"
    usage_prompt: >-
      明确请求调整调度并比较影响时调用。settings 支持 RULE/OUTFLOW/LEVEL；人工模式须明确目标，不能补零。
      time_h 是比较目标 t1，省略采用本轮地图帧；初始水位和库容固定，不能指定。
      能力参数仅按明确请求修改，max_release_m3s 同时替换能力与安全泄量，须说明此假设。
      指定道路先查 RoadRoute/Road ID，未指定对象则比较全部已收录路段。
      返回已包含候选方案的统一影响分析，不再用正式预测的分析结果代替。
      依次说明 reservoir_safety、selected_time、window_envelope；邻近积水及桥隧高程未知不能表述为路面已淹。
      失败或 partial 不代表安全；结果为独立试算，未应用方案。
    function_type: computation
    tool_policy: {read_only: false, requires_confirmation: false, worker_allowed: false, idempotent: false, invalidates_cache: false}
    timeout_seconds: 360
    concurrency_safe: false
    involves_objects: [Reservoir, FloodForecast, RoadRoute, Road, Bridge, InundationForecastCell]
    max_result_chars: 40000
    params:
      settings:
        type: dict
        description: "相对 t0 原方案的调整；能力参数仅按明确要求修改"
        json_schema:
          additionalProperties: false
          properties:
            mode: {type: string, enum: [RULE, OUTFLOW, LEVEL]}
            target_outflow_m3s: {type: [number, 'null'], minimum: 0}
            target_level_m: {type: [number, 'null'], minimum: 0}
            normal_release_m3s: {type: number, minimum: 0}
            outlet_capacity_m3s: {type: number, minimum: 0}
            max_release_m3s: {type: [number, 'null'], minimum: 0}
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      time_h: {type: float, description: "要比较的 t1 相对原预测 t0 的小时偏移，默认本轮地图选中帧", required: false}
      target_type: {type: str, description: "影响比较类型，默认 Road；支持 RoadRoute、Bridge 等现有影响对象类型", default: "Road"}
      object_ids: {type: list, description: "只比较这些已查询的对象 ID；省略分析整个类型，空数组表示空范围", required: false, json_schema: {items: {type: string}}}

  # 转移方案分析
  compare_evacuation_sites:
    summary: "筛选并推荐安置点"
    description: "为指定转移单元，在指定候选集合或 ID 列表内筛选容量满足转移人数、位置有效且在所选洪水状态下未判定受淹的安置点，再按直线距离排序，推荐最近的合格地点。返回各候选点及不合格原因、合格集合和 recommended_site_id；没有合格地点时不推荐。沿用有效预测或演进前无洪水初始状态，不扩展候选范围，不预留容量，不验证路线可达性。"
    usage_prompt: >-
      为指定转移单元综合筛选并推荐安置点时调用；候选范围用 object_set_id 或 object_ids 二选一。
      仅比较容量用 query，已有集合内按属性筛选用 refine_object_set；附近地点与距离用 find_nearby_objects。
      所需容量默认取单元人口，用户明确人数时才覆盖。推荐按容量、位置及所选洪水状态筛选，再按直线距离排序。
      recommended_site_id 不代表路线可达或床位已预留；用户要求路线或完整转移方案时再 plan_route。
      集合保存失败可用 eligible_object_ids 继续；没有合格地点时不推荐。
    function_type: lookup
    involves_objects: [EvacuationUnit, EvacuationSite, FloodForecast]
    params:
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      evacuation_unit_id: {type: str, description: "起点转移单元 ID"}
      object_set_id: {type: str, description: "候选安置点集合 ID；与 object_ids 二选一", default: ""}
      object_ids: {type: list, description: "指定候选安置点 ID 列表；与 object_set_id 二选一，空列表表示没有候选点", required: false, json_schema: {items: {type: string}}}
      required_capacity: {type: int, description: "明确要求转移的人数，默认起点人口", required: false}
      view: {type: str, description: "对话中 current 为本轮分析时刻 / time_slice 指定时刻 / simulation_current 演进时刻 / envelope 最大包络", default: "current", json_schema: {enum: [current, time_slice, simulation_current, envelope]}}
      time_h: {type: float, description: "指定预测时刻偏移，小时", required: false}

  plan_route:
    summary: "根据所选洪水状态规划避洪路线"
    description: "调用高德生成驾车或步行候选路线并按当前洪水状态避让。未开始演进时按无洪水初始状态规划；开始后必须有适用预测，预测无淹没时正常规划，存在淹没时排除涉水候选。"
    usage_prompt: >-
      请求路线、导航或怎么走时调用，始终按避洪语义规划，不额外询问是否避洪。
      演进前按初始无洪水约定；演进后须有适用预测，由工具检查候选路线，缺失或失效时停止。
      优先用起点对象 ID 与 destination_site_id，缺少对象才用坐标；未指定终点可查单元已有路线的默认终点。
      profile 默认 car，明确步行用 foot，禁行阈值分别为0.3米和0.15米。
      说明本次采用的洪水状态与预测时刻。失败后不自动放宽约束；明确改变交通方式、终点或时刻时可按新条件规划。
      成功后用 route.evacuation_route_id 展示该路线；查看既有路线只查询/展示，复核通行状态用 review_route。
    function_type: computation
    concurrency_safe: false
    tool_policy: {read_only: false, requires_confirmation: false, worker_allowed: false, idempotent: false, invalidates_cache: true}
    involves_objects: [EvacuationRoute, EvacuationUnit, EvacuationSite, FloodForecast, InundationForecastCell]
    params:
      view: {type: str, description: "对话中 current 为本轮分析时刻；time_slice 配合 time_h 指定切片；simulation_current 指演进时刻；envelope 指整个预测期最大包络", default: "current", json_schema: {enum: [current, time_slice, simulation_current, envelope]}}
      start_object_type: {type: str, description: "起点领域对象类型，通常为 EvacuationUnit/EvacuationSite/Facility", default: "EvacuationUnit"}
      start_object_id: {type: str, description: "起点领域对象ID", default: ""}
      destination_site_id: {type: str, description: "目标安置地点 EvacuationSite ID；EvacuationUnit 已有路线关联终点时可省略", default: ""}
      start_lon: {type: float, description: "无起点对象时使用的起点经度", required: false}
      start_lat: {type: float, description: "无起点对象时使用的起点纬度", required: false}
      destination_lon: {type: float, description: "无安置点对象时使用的终点经度", required: false}
      destination_lat: {type: float, description: "无安置点对象时使用的终点纬度", required: false}
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      time_h: {type: float, description: "可选预测时刻，小时；对话中不传默认本轮分析时刻，view=envelope 使用最大包络", required: false}
      blocked_depth_m: {type: float, description: "禁行水深阈值，米；不传时 car 使用0.3、foot 使用0.15", required: false}
      profile: {type: str, description: "高德路由模式: car/foot", default: "car", json_schema: {enum: [car, foot]}}
      max_endpoint_distance_m: {type: float, description: "高德路线起终点与领域对象坐标允许的最大距离，米", default: 800}
      max_detour_ratio: {type: float, description: "允许的最大路线绕行倍率", default: 10}

  review_route:
    summary: "按所选洪水状态复核已有路线"
    description: "使用当前有效预测复核既有线形，不调用路由引擎，不修改或替换原路线。返回 passable、依据及预测版本；未知状态不能当作可通行。"
    usage_prompt: "用户问刚才那条路线现在还可用吗、指令中路线状况是否变化时使用。从对话中已确认的路线 ID 或根据指令正文查询确定路线；无法唯一确定时询问用户，不编造 ID。不重新规划，也不自动发送新指令。"
    function_type: lookup
    involves_objects: [EvacuationRoute, FloodForecast, EmergencyDirective]
    params:
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      evacuation_route_id: {type: str, description: "需要复核的既有路线 ID"}
      view: {type: str, description: "对话中 current 为本轮分析时刻 / time_slice 指定时刻 / simulation_current 演进时刻 / envelope 最大包络", default: "current", json_schema: {enum: [current, time_slice, simulation_current, envelope]}}
      time_h: {type: float, description: "指定预测时刻偏移，小时", required: false}

  analyze_latest_evacuation_time:
    summary: "根据24小时淹水序列分析最晚安全转移时间"
    description: "读取当前演进工作空间的0至24小时水深时间序列，沿指定转移安排的起点、预定路线和安置点逐时检查禁行水深，返回首次不可通行时刻、最后一个确认安全时间切片，以及扣除路线通行或核定清空耗时后的理论最晚出发时刻。"
    usage_prompt: >-
      询问最晚转移时间、截止时间或安全窗口时调用，使用同一预测版本完整24小时水深序列。
      单元 ID/名称至少提供一项。已有确认路线时传 evacuation_route_id，须对应该单元；
      省略时选择该单元关联路线中的最新记录，不能把新目的地与旧路线混用。
      blocked_depth_m 沿用路线阈值，缺失时步行0.15米、其他0.3米。
      有核定清空耗时时传 clearance_duration_min，否则仅按路线通行时间或1米/秒估算，不包含人员集结与分批运输。
      safe_through_horizon 表示预测期内未形成截止时间，不能把24小时末端作为最晚出发时间。
      route_becomes_unsafe 时同时说明首次不可通行与最后确认安全时刻；partial/incomplete_coverage 只能报告已覆盖部分风险。
      按 deadline 返回的实际时刻回答；EvacuationUnit.flood_arrival_window 是预案字段，不能替代本计算。
    function_type: computation
    involves_objects: [EvacuationUnit, EvacuationRoute, EvacuationSite, FloodForecast, InundationForecastCell]
    params:
      evacuation_unit_id: {type: str, description: "转移单元ID；与 evacuation_unit_name 至少提供一项", default: ""}
      evacuation_unit_name: {type: str, description: "转移单元或其原始村名，如新民村；已知 evacuation_unit_id 时可不传", default: ""}
      evacuation_route_id: {type: str, description: "可选转移路线ID；不传时按 origin_unit_id 查找该转移单元的路线", default: ""}
      forecast_id: {type: str, description: "预测版本；对话中 latest 绑定本轮分析版本", default: "latest"}
      blocked_depth_m: {type: float, description: "路线禁行水深阈值，米；默认沿用所选路线", required: false}
      clearance_duration_min: {type: float, description: "可选的核定转移准备、通行和路线清空总耗时，分钟", required: false}
      safety_buffer_min: {type: float, description: "额外安全提前量，分钟", default: 0}

# 前端动作：地图展示与指令草稿；不承担隐式业务复核。
presentation_tools:
  ui_show_objects:
    summary: "在 GIS 地图中显示领域对象"
    description: "在前端 GIS 地图中显示一个或多个领域对象。对象类型必须来自 ontology，不使用前端图层名。"
    usage_prompt: >-
      展示一个或多个对象时调用，对象名称映射来自 ontology：{object_aliases}。
      object_ids 限定精确范围；object_set_id 可叠加 filters 取交集，返回对应子集引用，保存失败则保留精确 ID。
      默认 mode=add 追加。仅明确替换同类型全部显示时用 mode=replace；只保留候选子集时用 replace_object_set_id。
      空范围通常不改地图；明确替换某集合为空时只移除该集合。返回 selection_id 供后续隐藏。
      水动力 filters 仅支持 forecast_id/time_h/view。默认 timeline 浏览预测，从首个可用帧开始；
      current 与 simulation_current 使用本轮冻结的分析帧或演进时刻，time_slice 指定 time_h，envelope 为包络。
      timeline/time_slice/envelope 可显示明确版本，latest 可打开本轮新运行的预测。
      展示分析结论应传分析结果的明确版本与切片/包络，避免切回首帧。仅显示模型网格不会清除预测。
      展示受影响对象按 affected_object_ids 设置 object_ids、highlight=true；多个类型放在同一次 objects 调用中。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_hide_objects:
    summary: "隐藏指定地图对象"
    description: "按 selection_id 或对象类型、ID、过滤条件隐藏对象，不改变其他对象和地图视野。"
    usage_prompt: "隐藏这些、刚才那些对象时优先引用当前 visible_selections 的 selection_id。不能确定所指集合时询问用户。空 ID 列表不执行隐藏。"
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_hide_forecast:
    summary: "隐藏预测淹没结果"
    description: "隐藏预测淹没结果及其影响分析展示，保留其他对象和视野。"
    usage_prompt: "只在用户要求隐藏或清除淹没结果时调用。"
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

  ui_reset_map:
    summary: "重置整个地图"
    description: "清除所有非基础图层、淹没结果、警戒、影响分析和事件标记，并重置视野。"
    usage_prompt: "仅用户明确要求重置整个地图时调用。禁止用于隐藏某个对象、某类对象或这些对象。"
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

  ui_set_inundation_alert:
    summary: "设置珊瑚河流域预测淹没警戒"
    description: "根据24小时洪水预测是否存在淹没，开启或清除珊瑚河流域边界的红色警戒样式。"
    usage_prompt: >-
      只用于表达当前24小时预测是否存在淹没，不表示整个流域都会被淹，
      也不用于判断具体道路、设施或转移对象是否受影响。
      active=true 显示红色流域警戒边界，active=false 清除警戒并恢复默认边界。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

  ui_focus_object:
    summary: "定位并高亮 GIS 对象"
    description: "缩放、打开弹窗并高亮前端地图中的一个领域对象，不修改领域数据。"
    usage_prompt: "用户要求定位、聚焦或缩放到某个对象时调用。"
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_show_event_marker:
    summary: "在 GIS 地图中显示事件标记"
    description: "在前端 GIS 地图中显示一个具有明确单点位置的领域事件 marker，不修改领域数据。"
    usage_prompt: >-
      只有事件对象包含明确 longitude/latitude 时才调用；没有明确单点位置的事件不创建 marker。
    side_effect_scope: frontend_map
    mutates_domain: false
    object_scope: mappable
    requires_confirmation: false
    worker_allowed: false

  ui_open_emergency_directive_editor:
    summary: "打开应急指令草稿编辑器"
    description: "根据智能体当前建议生成应急指令初稿，并在态势工作台打开编辑器供用户修改、确认和发出；本工具本身不发出指令。"
    usage_prompt: >-
      用户明确要求把当前或刚才的建议作为初稿、新建应急指令或准备发出指令时调用。
      title、content 和 recipients 必须根据本轮对话及已核实事实生成；priority 默认 urgent。
      正文应直接可执行，避免加入未经工具核实的距离、通行状态或资源承诺。
      路线受阻不妨碍起草暂停使用、现场核查或替代方案准备指令；保留已知风险，不把受阻路线写成可通行。
      调用后不要声称指令已经发出，必须说明草稿已在编辑器中打开，等待用户修改和确认。
    side_effect_scope: frontend_editor
    mutates_domain: false
    object_scope: none
    requires_confirmation: false
    worker_allowed: false

# 用户对话：跨工具共同约定。
interaction_policies:
  user_chat:
    description: "珊瑚河 GIS 用户对话策略"
    include_in_system_prompt: true
    instructions:
      # 跨工具约定；具体操作条件、默认值与结果解释放在对应工具中。
      - "现在/当前/总结当前情况使用本轮分析时刻：提问时地图选中的预测帧，无选中帧才使用演进时钟。状态、影响、路线、安置点分析共用冻结版本；这些工具的 forecast_id=latest 绑定本轮版本。view=current 使用该帧，time_slice 配合 time_h 指定帧，simulation_current 明确使用演进时刻，envelope 分析整个预测期最大包络。包络不能表述为当前已淹。"
      - "time_h 及其他预测小时偏移均相对 valid_from。回复优先使用 analysis_time_at、valid_at、first_unsafe_at、latest_departure_at 等实际时刻，可补充预测 +Nh；generated_at 是生成时间。缺失值、partial 或覆盖不足表示未知，不得解释为安全或无洪水；未开始演进时仅按工具返回的演示初始状态回答。"
      - "查询、计算、地图展示和指令草稿分别执行。已有预测可直接分析；只有明确请求运行、重算或更新预测时才调用 run_flood_forecast。地图操作调用相应 ui_*；路线规划请求默认包含展示生成的路线，其他分析仅在用户要求展示时更新地图。"
      - "查询和统计保留地域、类别、距离、时间和受淹条件。地域先查 Town/County ID；附近数量用 total_matched，受淹数量用 analyze_inundation_impacts 的范围汇总，不替换为全库 count。连续对话沿用参考对象、候选集合和确认路线；object_ids 省略与空数组不同，空集合不得扩大为全量。"
      - "对象级预测影响调用 analyze_inundation_impacts；最晚转移时间或安全窗口调用 analyze_latest_evacuation_time。按工具返回解释结果；估算值必须说明来源，预案字段和缺失值不能作为预测证据。"
      - "地图动作结果 pending 只表示已请求，map_action_receipts 为执行回执，visible_selections/visible_layers 为实际可见状态。回复简洁说明已请求显示或隐藏，不输出内部 ID 或回执机制。普通高亮不代表受淹；隐藏这些对象优先引用 selection_id，范围不明确时澄清；整体重置须有明确请求。"
      - "Road 是独立路段，RoadRoute 是按可靠编号聚合的已收录路段，RoadRouteSegment 表达多对多归属。所有道路地图展示 Road，指定编号道路查询 RoadRoute.ref。数量区分道路与路段，包含未编号路段；影响表述为已收录 N 段中 M 段受影响，共线路段不跨道路重复累加为唯一总数，不推断整条道路不可通行。"
      - "Catchment 表达水库上游降雨汇集范围，不是淹没范围；龙潭集水区与原始流域边界有差异，不能推断严格空间包含。当前系统不提供设计洪水方案切换，综合指标不能转换为年一遇标准。"
      - "调度调整先 get_longtan_dispatch_plan，再 simulate_longtan_dispatch；从所选预测 t0 初态试算，地图帧为比较目标 t1。按结果先解释水库安全再比较道路影响；当前仅支持候选试算，不能声称已切换正式方案。"
      - "指令草稿使用 ui_open_emergency_directive_editor，内容基于对话与已核实事实；草稿编辑器只接收文字和优先级，不隐式复核或否决路线。实际发出由用户在前端确认；涉及已发指令或发出状态，先 query EmergencyDirective 核实记录，不能仅凭聊天中曾打开草稿就断言未发出。持续演进的开始/暂停使用态势工作台按钮，单次研判不启动持续任务。"
    # 目前仅 count 被 server/chat/policy.py 读取。状态与调度提示在该模块识别，
    # 其余请求由模型结合工具说明处理；此处不声明未实现的关键词路由。
    intents:
      count:
        keywords: ["几个", "多少个", "几条", "多少条", "数量", "总数"]
        tools: [count]
        task_hint: "本问题是领域对象库的直接数量查询。请直接调用 {calls}；不要先查询无关对象或对象几何，也不要添加用户未明确给出的过滤条件。得到 count 结果后立即回答。"

# 自动事件：受各自工具白名单约束，与用户对话分开。
event_policies:
  FloodForecastRequired:
    display_name: "洪水预测请求事件"
    role: "珊瑚河洪水应急智能体"
    description: "领域策略已根据当前时刻至 +24h 的边界流量预测窗口生成洪水预测请求。"
    allowed_tools: [inspect, query, count, run_flood_forecast]
    forbidden_functions: [assess_flood_emergency]
    instructions:
      - "领域策略已经完成阈值判断；当事件 forecast_trigger.should_run_forecast=true 时，必须由你调用一次 run_flood_forecast，forecast_id 使用 latest。不要只用文字说明将要预测。"
      - "事件 payload 包含当前预测时刻 observation、与触发判断完全相同的 25 点 forecast_input，以及 forecast_trigger；run_flood_forecast 会读取事件对应的稳定输入快照，CNN 计算与结果保存由该工具完成。"
      - "本事件仅运行预测；完成后发布预测淹没结果生成事件，由其设置警戒并展示结果。说明本事件不执行对象级影响分析，后续预测淹没结果生成事件也不自动执行，需用户明确提出后分析；不自动形成或发布响应指令。"
    conclusion_fields: ["24小时预测窗口", "触发原因", "是否调用了预测模型"]

  InundationGenerated:
    display_name: "预测淹没结果生成事件"
    role: "珊瑚河洪水应急智能体"
    description: "水动力模型已经生成24小时预测结果，本事件负责判断预测期内是否存在淹没并表达流域警戒态势。"
    allowed_tools: [ui_set_inundation_alert, ui_show_objects]
    forbidden_functions: [assess_flood_emergency]
    instructions:
      - "展示新预测时调用 ui_show_objects，filters 使用 forecast_id=latest、view=timeline，打开0.5至24小时的预测时间轴；不要请求缺失的当前+0h切片，也不要改成最大包络代替时间轴。"
      - "只根据事件 payload 中 CNN 预测汇总判断未来24小时是否存在淹没：forecast_cell_count>0 表示存在至少一个水深不低于0.04米的预测淹没单元，否则表示无淹没。"
      - "必须调用一次 ui_set_inundation_alert：存在淹没时传 active=true，无淹没时传 active=false，以确保旧警戒状态也能被清除。"
      - "本事件不执行对象级影响分析，不判断具体道路、设施、桥梁、转移路线、转移对象或安置点是否受影响；这些分析只在用户明确提出后执行。"
      - "本事件不生成响应方案或发布指令。"
    automatic_map:
      mode: when_relevant
      tool: ui_show_objects
      objects:
        - object_type: HydrodynamicGridCell
          filters: {forecast_id: latest, view: timeline}
          label: "预测淹没结果"
          fit: false
          refresh: true
      allowed_action_types: [show_hydrodynamic_mesh, apply_hydrodynamic_result, set_watershed_inundation_alert]
      other_objects: on_user_request
      include_result_cards: false
