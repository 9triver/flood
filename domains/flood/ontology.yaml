    summary: "连接转移单元与安置地点的路线"
    description: "EvacuationRoute 表达从 EvacuationUnit 到 EvacuationSite 的预定或动态规划路线，通过 route_type 区分转移、救援、绕行和保障路线。"
    properties:
      evacuation_route_id: {type: str, required: true, description: "转移路线稳定ID"}
      name: {type: str, description: "规范显示名"}
      source_name: {type: str, description: "原始数据中的路线名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      route_type: {type: str, description: "路线类型: transfer/rescue/detour/supply"}
      road_detail: {type: str, description: "路线道路描述"}
      origin_unit_id: {type: str, description: "起点转移单元ID；非转移单元起点的动态路线可为空"}
      destination_site_id: {type: str, description: "终点安置地点ID"}
      population: {type: int, description: "服务或转移人口"}
