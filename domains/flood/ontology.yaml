  Road:
    kind: entity
    countable: true
    display_name: "路段"
    aliases:
      - {terms: ["路段"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_id
    summary: "道路路段"
    description: "Road 表达独立几何路段，保留原始 road_id。包括未能归属编号道路的路段；通过 RoadRouteSegment 多对多关联 RoadRoute。"
    properties:
      road_id: {type: str, required: true, description: "路段稳定ID"}
      road_route_ids: {type: list, description: "按规范 ref 归属的 RoadRoute ID 列表；空列表表示未归属"}
      name: {type: str, description: "道路名称"}
      source_name: {type: str, description: "原始路网中的道路名称"}
      name_source: {type: str, description: "规范显示名的生成或校正方式"}
      ref: {type: str, description: "道路编号，如 G65、G78、G241"}
      county_id: {type: str, description: "道路代表点所在县编码；边界附近道路允许按500米容差归属最近县"}
      road_class: {type: str, description: "道路等级或 fclass"}
      one_way: {type: str, description: "单向/双向标记"}
      bridge_flag: {type: bool, description: "该路段是否标记为桥上路段"}
      tunnel_flag: {type: bool, description: "该路段是否标记为隧道路段"}
      length_m: {type: float, description: "道路长度，米"}

  RoadRoute:
    kind: entity
    countable: true
    display_name: "编号道路"
    aliases:
      - {terms: ["道路", "公路"]}
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_route_id
    summary: "由多个已收录路段组成的编号道路"
    description: "仅按 Road.ref 的可靠编号聚合，不根据同名或邻近关系猜测归属。几何为成员路段的 MultiLineString，可不连续，包含双向线和已标号匝道，不保证拓扑连通或覆盖整条道路。名称取单一编号路段的众数，缺失时回退所有成员名称众数或编号，不代表官方名称核定。"
    properties:
      road_route_id: {type: str, required: true, description: "稳定ID，如 road_route_G65"}
      ref: {type: str, description: "单一道路编号，如 G65"}
      name: {type: str, description: "从成员路段推导的显示名称"}
      name_source: {type: str, description: "显示名称选取依据"}
      source_names: {type: list, description: "成员中出现的名称，保留名称差异"}
      road_category: {type: str, description: "expressway/other/mixed；按路段等级而非编号前缀判断"}
      road_class: {type: str, description: "成员路段最常见的等级"}
      road_ids: {type: list, description: "已收录成员路段ID，可用 Road.road_id__in 查询"}
      segment_count: {type: int, description: "已收录路段数量"}
      geometry_segment_count: {type: int, description: "具有可展示线几何的成员路段数量"}
      shared_segment_count: {type: int, description: "同时属于其他编号道路的路段数量"}
      recorded_length_m: {type: float, description: "已收录路段长度之和，含双向线及匝道，不是道路里程或全长"}
      membership_basis: {type: str, description: "归属依据 Road.ref"}
      coverage_scope: {type: str, description: "仅包含项目已收录路段"}

  RoadRouteSegment:
    kind: entity
    countable: false
    display_name: "道路与路段关联"
    data_source: external_api
    mutability: read_only
    source:
      type: resolver
      resolver: flood_repository
      id_field: road_route_segment_id
    summary: "编号道路与路段的多对多关联"
    description: "一个路段可归属于多条编号道路；无可靠编号的路段不自动关联。先从道路或路段查询关联，再通过关联取得另一端对象。"
    properties:
      road_route_segment_id: {type: str, required: true, description: "道路与路段组合稳定ID"}
      road_route_id: {type: str, description: "RoadRoute ID"}
      road_id: {type: str, description: "Road ID"}
      ref: {type: str, description: "关联的单一道路编号"}
      membership_basis: {type: str, description: "归属依据 Road.ref"}

