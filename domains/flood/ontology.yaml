rules:
  reservoir_level_status:
    description: "根据龙潭水库水位判定地图和图表使用的确定性颜色等级"
    rule_type: classification
    applies_to: [Reservoir]
    result_field: level_status
    source: "龙潭水库正常蓄水位、设计洪水位和校核洪水位"
    conditions:
      - field: reservoir_level_m
        operator: gt
        value: 248.91
        result: {key: critical, label: "超校核洪水位", color: "#c62828"}
      - field: reservoir_level_m
        operator: gte
        value: 247.92
        result: {key: danger, label: "设计洪水位以上", color: "#e66a19"}
      - field: reservoir_level_m
        operator: gte
        value: 245.30
        result: {key: warning, label: "正常蓄水位以上", color: "#c99700"}
      - field: reservoir_level_m
        operator: lt
        value: 245.30
        result: {key: normal, label: "正常", color: "#238b57"}

  reservoir_level_alert:
    description: "按当前至未来24小时预测最高水位返回唯一且最高级别的水库调度提示"
    rule_type: threshold
    applies_to: [Reservoir]
    result_field: alert
    source: "龙潭水库设计洪水位和校核洪水位；接近阈值统一提前0.30米"
    conditions:
      - field: reservoir_level_m
        operator: gt
        value: 248.91
        result:
          severity: critical
          text: "警告：水位超校核洪水位！大坝安全面临严峻考验"
          future_text_template: "警告：水位将在{triggered_at}超校核洪水位！大坝安全面临严峻考验"
          current_text_template: "警告：水位已于{triggered_at}超校核洪水位！大坝安全面临严峻考验"
      - field: reservoir_level_m
        operator: gte
        value: 248.61
        result:
          severity: danger
          text: "入库流量持续加大，水位逼近校核洪水位"
          future_text_template: "入库流量持续加大，水位将在{triggered_at}逼近校核洪水位"
          current_text_template: "入库流量持续加大，水位已于{triggered_at}逼近校核洪水位"
      - field: reservoir_level_m
        operator: gte
        value: 247.62
        result:
          severity: warning
          text: "为保障大坝安全，按泄洪设施下泄能力下泄"
          future_text_template: "预计水位将在{triggered_at}接近设计洪水位。为保障大坝安全，按泄洪设施下泄能力下泄"
          current_text_template: "水位已于{triggered_at}接近设计洪水位。为保障大坝安全，按泄洪设施下泄能力下泄"

functions:
  get_flood_status:
    summary: "只读查询当前或预测时段的淹没状态"
    description: "检查当前工作空间、演进时间、预测输入版本和有效期，返回是否存在对应预测淹没。不会生成预测、切换地图或修改演进状态。演进未开始且查询当前状态时 has_inundation=false，依据演示初始约定；开始后缺少有效预测时 has_inundation=null，不表示无淹水。"
    usage_prompt: "用户问现在有没有淹没或淹水时首先调用，默认 view=current 为当前演进时刻的模型切片。明确询问未来总体风险时 view=envelope；指定预测偏移时 view=time_slice 并传 time_h。未开始演进时，当前状态按无洪水初始约定回答，不能声称已运行预测；若问未来则需要先演进并生成预测。开始后输入更新或没有对应切片时说明无法判断并按 next_step 提示下一步。面向用户不输出 workspace_id、simulation_time、not_started 等内部字段。不得自动运行模型或显示地图，也不得把包络说成现在已淹。"
    function_type: lookup
    involves_objects: [FloodForecast, InundationForecastCell]
    params:
      view: {type: str, description: "current 当前演进时刻 / time_slice 指定时刻 / envelope 预测最大包络", default: "current"}
      time_h: {type: float, description: "view=time_slice 时的预测偏移小时数", default: ""}

  find_nearby_objects:
    summary: "查询参考对象附近的点位"
    description: "按对象代表位置的 WGS84 直线距离筛选并排序附近对象；返回范围、距离、数量和可直接展示的 ID。不是名称匹配，也不是道路通行距离。"
    usage_prompt: "先通过带名称过滤的 query 找到参考对象 ID。附近默认半径3000米、每页10个；用户明确指定时按用户参数查询。计数使用 total_matched。要求全部时逐页使用 next_offset 直到 has_more=false，再汇总 ID 展示。更远使用 min_distance_m 或排除已返回的 exclude_object_ids，不是只扩大 radius_m。回答必须说明实际距离区间及分页情况。可用 filters 按 site_type、facility_type、station_type、town_id、county_id、name、source_name 筛选，例如学校用 facility_type=school。结果 object_ids 可直接传入 ui_show_objects；空集合不得改为全量展示。"
    function_type: lookup
    involves_objects: [EvacuationUnit, EvacuationSite, Station, Facility, Bridge, Sluice, HydraulicStructure, Reservoir]
    params:
      reference_object_type: {type: str, description: "参考对象类型，如 EvacuationUnit"}
      reference_object_id: {type: str, description: "已查询确认的参考对象 ID"}
      target_type: {type: str, description: "目标类型，如 EvacuationSite", default: "EvacuationSite"}
      radius_m: {type: float, description: "查询半径，米，必须大于0", default: 3000}
      limit: {type: int, description: "每页数量，1至100；统计总数使用 total_matched", default: 10}
      min_distance_m: {type: float, description: "最小距离，米，与 radius_m 组成距离区间", default: 0}
      offset: {type: int, description: "跳过的匹配数量，后续页使用返回的 next_offset", default: 0}
      exclude_object_ids: {type: list, description: "排除之前已展示的对象 ID，避免更远查询重复返回", default: []}
      filters: {type: dict, description: "目标类型的名称、区域或类别过滤条件；如安置点 site_type=shelter、学校 facility_type=school", default: {}}

  run_flood_forecast:
    summary: "按当前演进输入运行洪水预测"
    description: "读取领域策略生成的最新版本化四边界流量输入快照，调用 CNN_V2 水动力模型生成水动力网格 max_depth 预测结果和 FloodForecast 汇总。普通边界观测不会直接改变该快照；该函数也不把 severity 或综合指标映射为 5/10/20/50/100 年一遇设计方案。"
    timeout_seconds: 360
    concurrency_safe: false
    usage_prompt: "只有用户明确要求运行、重算或更新预测，或当前自动事件策略要求计算时调用。查询现在有没有淹没时调用 get_flood_status；请求展示已有预测时只调用展示工具。运行前必须有当前演进时刻及对应预测输入；没有时不得用历史预测替代。结果只表示计算结果，不自动展示或开启警戒。"
    function_type: lookup
    involves_objects: [FloodForecast, InundationForecastCell, HydrodynamicGridCell, River, Reservoir]
    params:
      forecast_id: {type: str, description: "预测运行ID；latest 表示最新预测", default: "latest"}
      force: {type: bool, description: "是否强制重新运行简化模型", default: false}

  assess_flood_emergency:
    summary: "对已有预测进行单次应急研判"
    description: "读取当前有效预测的最大包络，生成预警级别、重点转移对象和处置建议。只执行一次，不运行 CNN、不启动持续演进、不发布指令。"
    usage_prompt: "用户请求一次应急研判或处置建议时调用。缺少预测时明确说明不可研判，不自动运行模型；需要持续演进时提示使用态势工作台开始/暂停按钮。结果表示未来预测窗口的风险，不是当前已受淹。只有明确要求地图展示时再调用 ui_*。"
    function_type: lookup
    involves_objects: [FloodForecast, InundationForecastCell, Road, EvacuationRoute, EvacuationUnit, EvacuationSite]
    params:
      refresh: {type: bool, description: "重新计算研判汇总；不重新运行洪水预测", default: false}

  analyze_inundation_impacts:
    summary: "根据预测淹没范围分析受影响对象"
    description: "读取最新或指定 InundationForecastCell 预测淹没网格，可按指定 time_h 分析某个预测时刻，默认使用当前演进时刻切片，显式 view=envelope 才使用最大水深包络；普通点执行空间邻近分析，道路与转移路线按完整线形与全部达标湿网格多边形求交，桥梁针对河槽无网格的特点执行独立的桥头影响区分析，返回受影响对象清单、风险等级和按类型汇总。"
    usage_prompt: >-
      target_type=RoadRoute 按独立路段分析后聚合，并保留 segment_impacts；all 和 Road 的 road_route_impacts 为额外道路汇总，不计入 total_impacts。无预测时不能解释为无风险。
      Road/EvacuationRoute 的 impacts 仅计完整线形与达标湿网格相交的对象；nearby_impacts 仅表示距湿网格边界 max_distance_m 内邻近积水，需核查，不能计为受淹。nearby_object_ids 仅用于用户明确要求的邻近风险展示。
      道路 depth_m 来自相交网格，overlap_length_m 为相交线形长度；intersecting_mesh_cell_ids 保留证据。邻近网格更深时不得将其水深当成道路水深。
      structure_overlap_unverified 表示桥上或隧道路段线形相交但路面高程未知，不得声称路面已淹。status=partial 和 linear_analysis 中的未评估项表示资料不完整，不能作为无影响结论。
      RoadRoute.affected_segment_count 仅统计相交路段，nearby_segment_count 是另列的邻近路段；应分别说明。
      本函数是对象级受淹判定的确定性空间分析入口，forecast_id 默认 latest，target_type 默认 all；只能根据返回结果说明哪些对象受影响，不得自行猜测。最大包络结果只表示预测时段内可能受淹，不是当前已经受淹。
      只有用户明确询问某个预测时间点或当前画面、时间轴选中位置时，才把对应 current_hydrodynamic_time_h 作为 time_h 传入；“现在/当前演进”默认 view=current，不自动采用前端选中的未来时刻；用户询问总体或最大影响时传 view=envelope 且不传 time_h。
      time_h 是相对 valid_from 的偏移量，回答用户时应以结果的 analysis_time_at 实际时刻为主，并把预测 +Nh 作为辅助信息。未传 time_h 默认使用当前演进时刻，只有 view=envelope 才使用最大包络。
      已有水动力时间轴时直接分析已有预测，除非用户明确要求重算，否则不要先调用 run_flood_forecast。
      桥梁默认检查80米桥头影响区内的完整湿网格多边形。桥梁结果中的 depth_m 和 nearby_max_depth_m 是邻近洪泛区最大水深，不是桥面水深；directly_inundated=false 表示模型未直接覆盖桥面。
      passability_status=inspection_required 表示周边或单侧桥头受淹、需要现场核查；likely_impassable 表示两侧桥头受淹。缺少桥面高程时，不得声称桥梁本体已经淹没。
      只有用户明确请求在地图展示影响对象时，才把 affected_object_ids 中各对象类型对应的对象项与 HydrodynamicGridCell 放入同一次 ui_show_objects 调用，并设置 object_ids 和 highlight=true；自动事件的展示范围由 event_policies 决定。
      指定对象范围用单个 target_type 加 object_ids 或 filters；两者同时提供取交集。object_ids=[] 是空集合。返回 analysis_scope 表明实际匹配的对象集合，total_impacts 只统计该集合受影响对象。分析某村周边点位先用附近查询取得 ID，再传入；不能用全类结果当该村结果。
      需要缩窄范围时 target_type 可传 RoadRoute、Road、Bridge、Facility、EvacuationRoute、EvacuationUnit、EvacuationSite、Station 或 all；min_depth_m 默认0.15，普通对象 max_distance_m 默认10，桥梁 bridge_influence_radius_m 默认80。除非用户明确要求敏感性分析，否则保持默认桥梁影响半径。
    function_type: lookup
    involves_objects: [FloodForecast, InundationForecastCell, RoadRoute, Road, Bridge, Facility, EvacuationRoute, EvacuationUnit, EvacuationSite, Station]
    params:
      object_ids: {type: list, description: "只评估这些对象 ID；省略则按类型和 filters；空数组不评估任何对象", default: ""}
      filters: {type: dict, description: "目标对象属性条件，如 town_id 或 site_type；与 ID 列表取交集", default: {}}
      view: {type: str, description: "默认 current 当前演进时刻；指定 time_h 时为该切片；仅明确总体最不利分析时使用 envelope", default: "current"}
      forecast_id: {type: str, description: "预测运行ID；latest 表示最新预测", default: "latest"}
      target_type: {type: str, description: "分析目标类型: RoadRoute/Road/Bridge/Facility/EvacuationRoute/EvacuationUnit/EvacuationSite/Station/all", default: "all"}
      min_depth_m: {type: float, description: "纳入影响判定的最低预测水深，单位 m", default: 0.15}
      max_distance_m: {type: float, description: "普通点到湿网格中心的匹配距离；道路线形到湿网格多边形的邻近核查距离（不会扩大受淹判定），单位 m；不用于桥梁", default: 10}
      time_h: {type: float, description: "可选预测时刻，单位小时；不传默认当前演进时刻，view=envelope 使用最大包络", default: ""}
      bridge_influence_radius_m: {type: float, description: "桥梁到预测湿网格多边形的桥头影响区半径，单位 m", default: 80}

  analyze_latest_evacuation_time:
    summary: "根据24小时淹水序列分析最晚安全转移时间"
    description: "读取当前演进工作空间的0至24小时水深时间序列，沿指定转移安排的起点、预定路线和安置点逐时检查禁行水深，返回首次不可通行时刻、最后一个确认安全时间切片，以及扣除路线通行或核定清空耗时后的理论最晚出发时刻。"
    usage_prompt: >-
      用户询问某个村、转移单元的最晚转移时间、转移截止时间或安全转移窗口时必须调用。
      已知 evacuation_unit_id 时优先传 evacuation_unit_id，否则可直接传 evacuation_unit_name；除非用户明确指定另一条路线，否则不要传 evacuation_route_id，函数会按 origin_unit_id 使用 EvacuationUnit 关联的预定路线。
      blocked_depth_m 默认0.3米；已有经核定的全体人员集结、分批运输和路线清空总耗时时传 clearance_duration_min，否则函数只按路线已有通行时间或1米/秒步行速度估算单程通行时间。
      只能根据返回的 deadline 回答：deadline_status=safe_through_horizon 表示24小时内没有由预测形成的截止时间，不得把24小时末端说成最晚转移时间；route_becomes_unsafe 时应同时说明首次不可通行时刻和最后确认安全时刻。
      回答时间时优先使用 first_unsafe_at、last_confirmed_safe_at、latest_safe_completion_at 和 latest_departure_at 等实际时刻，*_time_h 只作为相对 valid_from 的预测偏移量补充说明。
      EvacuationUnit.flood_arrival_window 只作为既有预案字段展示，不是本函数的预测判定依据；不要再逐格 query InundationForecastCell 自行推算。
    function_type: lookup
    involves_objects: [EvacuationUnit, EvacuationRoute, EvacuationSite, FloodForecast, InundationForecastCell]
    params:
      evacuation_unit_id: {type: str, description: "转移单元ID；与 evacuation_unit_name 至少提供一项", default: ""}
      evacuation_unit_name: {type: str, description: "转移单元或其原始村名，如新民村；已知 evacuation_unit_id 时可不传", default: ""}
      evacuation_route_id: {type: str, description: "可选转移路线ID；不传时按 origin_unit_id 查找该转移单元的路线", default: ""}
      forecast_id: {type: str, description: "预测运行ID；latest 表示当前工作空间最新预测", default: "latest"}
      blocked_depth_m: {type: float, description: "路线禁行水深阈值，米", default: 0.3}
      clearance_duration_min: {type: float, description: "可选的核定转移准备、通行和路线清空总耗时，分钟", default: ""}
      safety_buffer_min: {type: float, description: "额外安全提前量，分钟", default: 0}

  plan_route:
    summary: "根据当前演示洪水状态规划避洪路线"
    description: "调用高德生成驾车或步行候选路线并按当前洪水状态避让。未开始演进时按无洪水初始状态规划；开始后必须有适用预测，预测无淹没时正常规划，存在淹没时排除涉水候选。"
    usage_prompt: >-
      用户请求路线、导航、怎么走时都调用本工具，不需要用户额外声明避洪或选择模式。
      演进未开始时当前状态是无洪水初始状态，工具可以直接规划，不要求先开始演进或生成预测。
      演进开始后由工具自动使用当前有效预测；缺失、过期或失败时停止，不得当成没有洪水。
      优先使用起点对象 ID 和 destination_site_id，缺少对象才使用坐标。未明确终点时可通过转移单元已有路线查默认终点。
      默认按当前演进时刻；用户指定预测时刻才传 time_h，明确要求最不利情况才传 view=envelope。未演进时不能声称已校验未来预测。
      默认 profile=car；明确步行使用 foot。禁行阈值 car 默认0.3米、foot 默认0.15米。
      依据结果说明是初始无洪水状态，还是有效预测下的避洪路线；不要称为未做避洪检查的普通导航。
      失败后不得自动放宽约束重试；用户明确改变交通方式、终点或时刻时可按新条件规划，但不能关闭避洪校验。
      成功后按返回 route.evacuation_route_id 展示本次 EvacuationRoute。
    function_type: lookup
    involves_objects: [EvacuationRoute, EvacuationUnit, EvacuationSite, FloodForecast, InundationForecastCell]
    params:
      view: {type: str, description: "默认 current 当前演进时刻；指定 time_h 时为该切片；仅明确总体最不利分析时使用 envelope", default: "current"}
      start_object_type: {type: str, description: "起点领域对象类型，通常为 EvacuationUnit/EvacuationSite/Facility", default: "EvacuationUnit"}
      start_object_id: {type: str, description: "起点领域对象ID", default: ""}
      destination_site_id: {type: str, description: "目标安置地点 EvacuationSite ID；EvacuationUnit 已有路线关联终点时可省略", default: ""}
      start_lon: {type: float, description: "无起点对象时使用的起点经度", default: ""}
      start_lat: {type: float, description: "无起点对象时使用的起点纬度", default: ""}
      destination_lon: {type: float, description: "无安置点对象时使用的终点经度", default: ""}
      destination_lat: {type: float, description: "无安置点对象时使用的终点纬度", default: ""}
      forecast_id: {type: str, description: "洪水预测ID", default: "latest"}
      time_h: {type: float, description: "可选预测时刻，小时；不传默认当前演进时刻，view=envelope 使用最大包络", default: ""}
      blocked_depth_m: {type: float, description: "禁行水深阈值，米；不传时 car 使用0.3、foot 使用0.15", default: ""}
      profile: {type: str, description: "高德路由模式: car/foot", default: "car"}
      max_endpoint_distance_m: {type: float, description: "高德路线起终点与领域对象坐标允许的最大距离，米", default: 800}
      max_detour_ratio: {type: float, description: "允许的最大路线绕行倍率", default: 10}
